name: Validate ARMv7 ARMv8 single APK

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate-fat-arm-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=0 --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          sed -i '10i\
          \
              ndkVersion = "29.0.14206865"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

      - name: Restore cached libhevtun
        id: cache-libhevtun-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Build libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        run: bash compile-hevtun.sh

      - name: Copy libhevtun
        run: cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

      - name: Resolve libv2ray version
        run: |
          pushd AndroidLibXrayLite
          CURRENT_TAG=$(git describe --tags --abbrev=0)
          echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
          popd

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: ${{ env.CURRENT_TAG }}
          fileName: 'libv2ray.aar'
          out-file-path: V2rayNG/app/libs/

      - name: Setup Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Build unsigned Play Store ARMv7+ARMv8 APK
        run: |
          cd ${{ github.workspace }}/V2rayNG
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          ./gradlew assemblePlaystoreRelease -PFAT_ARM_APK=true --stacktrace

      - name: Verify exactly two ARM ABIs
        id: verify
        run: |
          APK=$(find "${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/release" -maxdepth 1 -type f -name '*armv7-armv8.apk' -print -quit)
          test -n "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          zipinfo -1 "$APK" | awk -F/ '/^lib\// {print $2}' | sort -u | tee /tmp/abis.txt
          grep -qx 'armeabi-v7a' /tmp/abis.txt
          grep -qx 'arm64-v8a' /tmp/abis.txt
          if grep -Eq '^x86(_64)?$' /tmp/abis.txt; then exit 1; fi
          test "$(wc -l < /tmp/abis.txt | tr -d ' ')" = "2"

      - name: Upload validation APK
        uses: actions/upload-artifact@v7
        with:
          name: v2rayNG-armv7-armv8-unsigned-validation
          path: ${{ steps.verify.outputs.apk }}
          if-no-files-found: error
          retention-days: 7
