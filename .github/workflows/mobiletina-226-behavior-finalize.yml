name: Finalize MobileTina 2.2.6 behavior

on:
  push:
    branches:
      - agent/mobiletina-2.2.6-port
    paths:
      - .github/workflows/mobiletina-226-behavior-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/mobiletina-2.2.6-port
          fetch-depth: 0

      - name: Apply MobileTina behavior guards safely
        id: patch
        shell: python
        run: |
          from pathlib import Path
          import traceback

          report = Path('.github/verification/mobiletina-226-behavior-finalize.txt')
          report.parent.mkdir(parents=True, exist_ok=True)
          status = 'FAILED'
          detail = ''
          try:
              vm = Path('V2rayNG/app/src/main/java/com/v2ray/ang/viewmodel/MainViewModel.kt')
              vm_s = vm.read_text(encoding='utf-8')
              vm_old = '''    fun getSubscriptions(context: Context): List<GroupMapItem> {
                  val subscriptions = MmkvManager.decodeSubscriptions()
                  if (subscriptionId.isNotEmpty()
                      && !subscriptions.map { it.guid }.contains(subscriptionId)
                  ) {
                      subscriptionIdChanged("")
                  }

                  val groups = mutableListOf<GroupMapItem>()
                  if (MmkvManager.decodeSettingsBool(AppConfig.PREF_GROUP_ALL_DISPLAY)) {
                      groups.add(
                          GroupMapItem(
                              id = "",
                              remarks = context.getString(R.string.filter_config_all)
                          )
                      )
                  }
                  subscriptions.forEach { sub ->
                      groups.add(
                          GroupMapItem(
                              id = sub.guid,
                              remarks = sub.subscription.remarks
                          )
                      )
                  }
                  return groups
              }
          '''
              vm_new = '''    fun getSubscriptions(context: Context): List<GroupMapItem> {
                  val subscriptions = MmkvManager.decodeSubscriptions()
                      .filter { it.guid != AppConfig.DEFAULT_SUBSCRIPTION_ID }
                  val validIds = subscriptions.map { it.guid }
                  if (subscriptionId.isBlank() || subscriptionId == AppConfig.DEFAULT_SUBSCRIPTION_ID || !validIds.contains(subscriptionId)) {
                      subscriptionId = subscriptions.firstOrNull()?.guid.orEmpty()
                      MmkvManager.encodeSettings(AppConfig.CACHE_SUBSCRIPTION_ID, subscriptionId)
                  }
                  return subscriptions.map { sub ->
                      GroupMapItem(
                          id = sub.guid,
                          remarks = sub.subscription.remarks
                      )
                  }
              }
          '''
              if vm_old not in vm_s:
                  raise RuntimeError('MainViewModel getSubscriptions block not found')
              vm_s = vm_s.replace(vm_old, vm_new, 1)

              nm = Path('V2rayNG/app/src/main/java/com/v2ray/ang/handler/NotificationManager.kt')
              nm_s = nm.read_text(encoding='utf-8')
              restart_const = '    private const val NOTIFICATION_PENDING_INTENT_RESTART_V2RAY = 2\n'
              restart_intent = '''        val restartV2RayIntent = Intent(AppConfig.BROADCAST_ACTION_SERVICE)
                  restartV2RayIntent.`package` = AppConfig.ANG_PACKAGE
                  restartV2RayIntent.putExtra("key", AppConfig.MSG_STATE_RESTART)
                  val restartV2RayPendingIntent = PendingIntent.getBroadcast(service, NOTIFICATION_PENDING_INTENT_RESTART_V2RAY, restartV2RayIntent, flags)

          '''
              restart_action = '''            .addAction(
                      R.drawable.ic_restore_24dp,
                      service.getString(R.string.title_service_restart),
                      restartV2RayPendingIntent
                  )
          '''
              for label, needle in [('restart const', restart_const), ('restart intent', restart_intent), ('restart action', restart_action)]:
                  if needle not in nm_s:
                      raise RuntimeError(f'Notification {label} block not found')
              nm_s = nm_s.replace(restart_const, '', 1).replace(restart_intent, '', 1).replace(restart_action, '', 1)

              core = Path('V2rayNG/app/src/main/java/com/v2ray/ang/core/CoreServiceManager.kt')
              core_s = core.read_text(encoding='utf-8')
              core_old = '''        if (MmkvManager.decodeSettingsBool(AppConfig.PREF_PROXY_SHARING)) {
                  context.toast(R.string.toast_warning_pref_proxysharing_short)
              } else {
                  context.toast(R.string.toast_services_start)
              }
          '''
              core_new = '''        if (MmkvManager.decodeSettingsBool(AppConfig.PREF_PROXY_SHARING)) {
                  context.toast(R.string.toast_warning_pref_proxysharing_short)
              }
          '''
              if core_old not in core_s:
                  raise RuntimeError('CoreServiceManager start toast block not found')
              core_s = core_s.replace(core_old, core_new, 1)

              main = Path('V2rayNG/app/src/main/java/com/v2ray/ang/ui/MainActivity.kt')
              main_s = main.read_text(encoding='utf-8')
              if 'import android.os.Build\n' not in main_s:
                  if 'import android.os.Bundle\n' not in main_s:
                      raise RuntimeError('MainActivity Bundle import marker not found')
                  main_s = main_s.replace('import android.os.Bundle\n', 'import android.os.Build\nimport android.os.Bundle\n', 1)
              main_s = main_s.replace('// IMPORTANT: this is the untouched 2.0.15 Real Delay service.', '// IMPORTANT: Smart Connect uses the native v2rayNG 2.2.6 Real Ping service.')
              main_old = '''        V2RayServiceManager.startVService(this)
                  if (isSmartConnect) {
          '''
              main_new = '''        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.CINNAMON_BUN &&
                      MmkvManager.decodeSettingsBool(AppConfig.PREF_PROXY_SHARING)
                  ) {
                      checkAndRequestPermission(PermissionType.ACCESS_LOCAL_NETWORK) { }
                  }
                  V2RayServiceManager.startVService(this)
                  if (isSmartConnect) {
          '''
              if main_old not in main_s:
                  raise RuntimeError('MainActivity startV2Ray marker not found')
              main_s = main_s.replace(main_old, main_new, 1)

              # Write only after every required source pattern has been validated.
              vm.write_text(vm_s, encoding='utf-8')
              nm.write_text(nm_s, encoding='utf-8')
              core.write_text(core_s, encoding='utf-8')
              main.write_text(main_s, encoding='utf-8')
              status = 'SUCCESS'
              detail = 'All MobileTina behavior guards applied.'
          except Exception as exc:
              detail = f'{type(exc).__name__}: {exc}\n{traceback.format_exc()}'

          report.write_text(f'status={status}\n{detail}\n', encoding='utf-8')
          print(report.read_text(encoding='utf-8'))

      - name: Validate and commit result
        shell: bash
        run: |
          set -euo pipefail
          report=.github/verification/mobiletina-226-behavior-finalize.txt
          git config user.name "VPN963"
          git config user.email "120357728+VPN963@users.noreply.github.com"
          if grep -q '^status=SUCCESS$' "$report"; then
            ! grep -q 'NOTIFICATION_PENDING_INTENT_RESTART_V2RAY' V2rayNG/app/src/main/java/com/v2ray/ang/handler/NotificationManager.kt
            ! grep -q 'toast_services_start' V2rayNG/app/src/main/java/com/v2ray/ang/core/CoreServiceManager.kt
            grep -q 'filter { it.guid != AppConfig.DEFAULT_SUBSCRIPTION_ID }' V2rayNG/app/src/main/java/com/v2ray/ang/viewmodel/MainViewModel.kt
            grep -q 'native v2rayNG 2.2.6 Real Ping service' V2rayNG/app/src/main/java/com/v2ray/ang/ui/MainActivity.kt
            grep -q 'ACCESS_LOCAL_NETWORK' V2rayNG/app/src/main/java/com/v2ray/ang/ui/MainActivity.kt
            git add V2rayNG/app/src/main/java/com/v2ray/ang/viewmodel/MainViewModel.kt \
                    V2rayNG/app/src/main/java/com/v2ray/ang/handler/NotificationManager.kt \
                    V2rayNG/app/src/main/java/com/v2ray/ang/core/CoreServiceManager.kt \
                    V2rayNG/app/src/main/java/com/v2ray/ang/ui/MainActivity.kt \
                    "$report"
            git diff --cached --check
            git commit -m "Preserve MobileTina behavior on v2rayNG 2.2.6"
          else
            git add "$report"
            git commit -m "Record MobileTina behavior finalizer failure"
          fi
          git push origin HEAD:agent/mobiletina-2.2.6-port
