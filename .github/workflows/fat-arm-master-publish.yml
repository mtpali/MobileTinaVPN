name: Publish signed ARMv7 ARMv8 single APK

on:
  push:
    branches:
      - master
    paths:
      - .github/fat-arm-trigger

permissions:
  contents: write
  issues: write

jobs:
  publish-fat-arm-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=0 --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          sed -i '10i\
          \
              ndkVersion = "29.0.14206865"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

      - name: Restore cached libhevtun
        id: cache-libhevtun-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Build libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        run: bash compile-hevtun.sh

      - name: Copy libhevtun
        run: cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

      - name: Resolve libv2ray version
        run: |
          pushd AndroidLibXrayLite
          CURRENT_TAG=$(git describe --tags --abbrev=0)
          echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
          popd

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: ${{ env.CURRENT_TAG }}
          fileName: 'libv2ray.aar'
          out-file-path: V2rayNG/app/libs/

      - name: Setup Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Decode signing keystore
        env:
          APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        run: |
          test -n "$APP_KEYSTORE_BASE64"
          printf '%s' "$APP_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android_keystore.jks"
          test -s "$RUNNER_TEMP/android_keystore.jks"

      - name: Build signed Play Store ARMv7+ARMv8 APK
        run: |
          cd ${{ github.workspace }}/V2rayNG
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          ./gradlew assemblePlaystoreRelease -PFAT_ARM_APK=true \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/android_keystore.jks" \
            -Pandroid.injected.signing.store.password=${{ secrets.APP_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.APP_KEYSTORE_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.APP_KEY_PASSWORD }}

      - name: Verify exactly two ARM ABIs and signature
        id: verify
        run: |
          APK=$(find "${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/release" -maxdepth 1 -type f -name '*armv7-armv8.apk' -print -quit)
          test -n "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          zipinfo -1 "$APK" | awk -F/ '/^lib\// {print $2}' | sort -u | tee /tmp/abis.txt
          grep -qx 'armeabi-v7a' /tmp/abis.txt
          grep -qx 'arm64-v8a' /tmp/abis.txt
          if grep -Eq '^x86(_64)?$' /tmp/abis.txt; then exit 1; fi
          test "$(wc -l < /tmp/abis.txt | tr -d ' ')" = "2"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$APK"

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: v2rayNG-armv7-armv8-signed
          path: ${{ steps.verify.outputs.apk }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified APK prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: armv7-armv8-signed-20260821-v2
          name: Signed ARMv7 + ARMv8 single APK
          prerelease: true
          generate_release_notes: false
          files: ${{ steps.verify.outputs.apk }}

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Fat ARM signed build failed: $GITHUB_RUN_ID" \
            --body "The one-file ARMv7+ARMv8 signed build failed. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
