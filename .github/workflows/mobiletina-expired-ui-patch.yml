name: Apply MobileTina expired subscription UI patch

on:
  push:
    branches:
      - agent/mobiletina-2.2.6-port
    paths:
      - .github/workflows/mobiletina-expired-ui-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/mobiletina-2.2.6-port
          fetch-depth: 0

      - name: Patch MainActivity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('V2rayNG/app/src/main/java/com/v2ray/ang/ui/MainActivity.kt')
          s = p.read_text()

          old = 'import com.v2ray.ang.handler.MobileTinaSubscriptionInfo\n'
          new = 'import com.v2ray.ang.handler.MobileTinaSubscriptionInfo\nimport com.v2ray.ang.handler.MobileTinaSubscriptionMarkerManager\n'
          assert old in s and new not in s
          s = s.replace(old, new, 1)

          old = '''        val autoArtwork: Int\n        val status: String\n        when {\n            running -> {\n                autoArtwork = R.drawable.mt_auto_blue\n                status = getString(R.string.mobiletina_status_connected)\n            }\n'''
          new = '''        val autoArtwork: Int\n        val status: String\n        when {\n            MobileTinaSubscriptionMarkerManager.isSubscriptionExpired() -> {\n                autoArtwork = R.drawable.mt_auto_red\n                status = "اشتراک شما به پایان رسید"\n            }\n            running -> {\n                autoArtwork = R.drawable.mt_auto_blue\n                status = getString(R.string.mobiletina_status_connected)\n            }\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''                normalizeSubscriptionNames()\n                setupGroupTab()\n                mainViewModel.reloadServerList()\n'''
          new = '''                normalizeSubscriptionNames()\n                showExpiredSubscriptionToastIfNeeded()\n                setupGroupTab()\n                mainViewModel.reloadServerList()\n'''
          assert s.count(old) >= 2
          s = s.replace(old, new, 2)

          old = '''    private fun normalizeSubscriptionNames() {\n        MmkvManager.decodeSubscriptions().forEach { cache ->\n            if (cache.guid == AppConfig.DEFAULT_SUBSCRIPTION_ID) return@forEach\n            val remarks = cache.subscription.remarks.trim()\n            if (remarks.isBlank() || remarks.equals("import sub", ignoreCase = true)) {\n                cache.subscription.remarks = DEFAULT_SUBSCRIPTION_NAME\n                MmkvManager.encodeSubscription(cache.guid, cache.subscription)\n            }\n        }\n    }\n'''
          new = '''    private fun showExpiredSubscriptionToastIfNeeded() {\n        if (MobileTinaSubscriptionMarkerManager.consumeExpiredToastPending()) {\n            toastError("اشتراک شما به پایان رسید")\n        }\n    }\n\n    private fun normalizeSubscriptionNames() {\n        MmkvManager.decodeSubscriptions().forEach { cache ->\n            if (cache.guid == AppConfig.DEFAULT_SUBSCRIPTION_ID) return@forEach\n            if (cache.subscription.remarks != DEFAULT_SUBSCRIPTION_NAME) {\n                cache.subscription.remarks = DEFAULT_SUBSCRIPTION_NAME\n                MmkvManager.encodeSubscription(cache.guid, cache.subscription)\n            }\n        }\n    }\n'''
          assert old in s
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          git diff --check
          grep -q 'MobileTinaSubscriptionMarkerManager.isSubscriptionExpired()' V2rayNG/app/src/main/java/com/v2ray/ang/ui/MainActivity.kt
          grep -q 'toastError("اشتراک شما به پایان رسید")' V2rayNG/app/src/main/java/com/v2ray/ang/ui/MainActivity.kt

      - name: Commit patch and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "MobileTina CI"
          git config user.email "actions@github.com"
          git rm .github/workflows/mobiletina-expired-ui-patch.yml
          git add V2rayNG/app/src/main/java/com/v2ray/ang/ui/MainActivity.kt
          git commit -m "Show expired subscription state in Auto UI"
          git push origin HEAD:agent/mobiletina-2.2.6-port
