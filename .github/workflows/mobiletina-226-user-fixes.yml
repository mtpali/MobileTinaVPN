name: Apply MobileTina 2.2.6 user fixes

on:
  push:
    branches:
      - agent/mobiletina-2.2.6-port
    paths:
      - .github/workflows/mobiletina-226-user-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/mobiletina-2.2.6-port
          fetch-depth: 0

      - name: Apply requested fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise RuntimeError(f'{label}: expected block not found in {path}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # 1) Settings defaults + completely remove the two root-only options from the Settings UI.
          path = 'V2rayNG/app/src/main/res/xml/pref_settings.xml'
          p = Path(path)
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '''        <CheckBoxPreference\n            android:key="pref_start_scan_immediate"\n            android:summary="@string/summary_pref_start_scan_immediate"\n            android:title="@string/title_pref_start_scan_immediate" />''',
              '''        <CheckBoxPreference\n            android:defaultValue="true"\n            android:key="pref_start_scan_immediate"\n            android:summary="@string/summary_pref_start_scan_immediate"\n            android:title="@string/title_pref_start_scan_immediate" />''',
              1
          )
          s = s.replace(
              '''        <CheckBoxPreference\n            android:defaultValue="true"\n            android:key="pref_sniffing_enabled"\n            android:summary="@string/summary_pref_sniffing_enabled"\n            android:title="@string/title_pref_sniffing_enabled" />''',
              '''        <CheckBoxPreference\n            android:defaultValue="false"\n            android:key="pref_sniffing_enabled"\n            android:summary="@string/summary_pref_sniffing_enabled"\n            android:title="@string/title_pref_sniffing_enabled" />''',
              1
          )
          root_block = '''        <CheckBoxPreference\n            android:defaultValue="false"\n            android:key="pref_root_mode_enabled"\n            android:summary="@string/summary_root_mode_enabled"\n            android:title="@string/title_root_mode_enabled" />\n\n        <CheckBoxPreference\n            android:defaultValue="false"\n            android:key="pref_root_lan_sharing"\n            android:summary="@string/summary_root_lan_sharing"\n            android:title="@string/title_root_lan_sharing" />\n\n'''
          if root_block not in s:
              raise RuntimeError('root settings XML block not found')
          s = s.replace(root_block, '', 1)
          p.write_text(s, encoding='utf-8')

          # Runtime Core fallback must also default sniffing OFF before Settings has ever been opened.
          replace_once(
              'V2rayNG/app/src/main/java/com/v2ray/ang/core/CoreConfigManager.kt',
              'MmkvManager.decodeSettingsBool(AppConfig.PREF_SNIFFING_ENABLED, true) != false',
              'MmkvManager.decodeSettingsBool(AppConfig.PREF_SNIFFING_ENABLED, false) != false',
              'sniffing runtime default'
          )

          # Remove Root UI/listener code from SettingsActivity.
          path = 'V2rayNG/app/src/main/java/com/v2ray/ang/ui/SettingsActivity.kt'
          p = Path(path)
          s = p.read_text(encoding='utf-8')
          for old in [
              'import androidx.lifecycle.lifecycleScope\n',
              'import com.v2ray.ang.extension.toastError\n',
              'import com.v2ray.ang.root.RootManager\n',
              'import kotlinx.coroutines.launch\n',
              '        private val enableRootMode by lazy { findPreference<CheckBoxPreference>(AppConfig.PREF_ROOT_MODE_ENABLE) }\n',
              '        private val lanSharing by lazy { findPreference<CheckBoxPreference>(AppConfig.PREF_ROOT_LAN_SHARING) }\n',
          ]:
              s = s.replace(old, '')
          listener_block = '''            enableRootMode?.setOnPreferenceChangeListener { _, newValue ->\n                if (newValue == true && !RootManager.cachedRoot()) {\n                    lifecycleScope.launch {\n                        if (checkAndRequestRoot()) {\n                            enableRootMode?.isChecked = true\n                        }\n                    }\n                    false\n                } else {\n                    true\n                }\n            }\n\n            lanSharing?.setOnPreferenceChangeListener { _, newValue ->\n                if (newValue == true && !RootManager.cachedRoot()) {\n                    lifecycleScope.launch {\n                        if (checkAndRequestRoot()) {\n                            lanSharing?.isChecked = true\n                        }\n                    }\n                    false\n                } else {\n                    true\n                }\n            }\n\n'''
          if listener_block not in s:
              raise RuntimeError('root listeners not found')
          s = s.replace(listener_block, '', 1)
          root_func = '''        private suspend fun checkAndRequestRoot(): Boolean {\n            val hasRoot = RootManager.refresh()\n            if (!isAdded) return false\n            if (!hasRoot) {\n                context?.toastError(R.string.toast_root_required)\n            }\n            return hasRoot\n        }\n\n'''
          if root_func not in s:
              raise RuntimeError('root helper not found')
          s = s.replace(root_func, '', 1)
          p.write_text(s, encoding='utf-8')

          # Permanently disable stale root flags from older installs now that the options are removed.
          path = 'V2rayNG/app/src/main/java/com/v2ray/ang/AngApplication.kt'
          p = Path(path)
          s = p.read_text(encoding='utf-8')
          if 'import com.v2ray.ang.handler.MmkvManager\n' not in s:
              s = s.replace('import com.v2ray.ang.handler.SettingsManager\n', 'import com.v2ray.ang.handler.MmkvManager\nimport com.v2ray.ang.handler.SettingsManager\n', 1)
          marker = '''        MMKV.initialize(this)\n\n        // Initialize WorkManager with the custom configuration\n'''
          new_marker = '''        MMKV.initialize(this)\n\n        // MobileTina no longer exposes or supports the two root-only Settings options.\n        // Clear stale values from upgrades so an invisible root mode can never remain active.\n        MmkvManager.encodeSettings(AppConfig.PREF_ROOT_MODE_ENABLE, false)\n        MmkvManager.encodeSettings(AppConfig.PREF_ROOT_LAN_SHARING, false)\n\n        // Initialize WorkManager with the custom configuration\n'''
          if marker not in s:
              raise RuntimeError('AngApplication MMKV marker not found')
          s = s.replace(marker, new_marker, 1)
          p.write_text(s, encoding='utf-8')

          # 2) Manual connected-server ping + 3) strict six-second Smart Connect budget.
          path = 'V2rayNG/app/src/main/java/com/v2ray/ang/ui/MainActivity.kt'
          p = Path(path)
          s = p.read_text(encoding='utf-8')

          old = '''        smartConnectJob = lifecycleScope.launch {\n            // Do not consume the six-second Real Delay window while a subscription refresh is still running.\n            withTimeoutOrNull(8_000L) {\n                while (subscriptionRefreshing && isActive) delay(50L)\n            }\n\n            val groups = mainViewModel.getSubscriptions(this@MainActivity)\n'''
          new = '''        smartConnectJob = lifecycleScope.launch {\n            // The complete Smart Connect selection phase is capped at six seconds.\n            // A subscription refresh may get a brief grace period, but it no longer adds an\n            // independent 8-second wait before the Real Ping window starts.\n            val smartDeadline = SystemClock.elapsedRealtime() + SMART_CONNECT_TIMEOUT_MS\n            val refreshGrace = (smartDeadline - SystemClock.elapsedRealtime()).coerceAtLeast(0L).coerceAtMost(750L)\n            if (refreshGrace > 0L) {\n                withTimeoutOrNull(refreshGrace) {\n                    while (subscriptionRefreshing && isActive) delay(50L)\n                }\n            }\n\n            val groups = mainViewModel.getSubscriptions(this@MainActivity)\n'''
          if old not in s:
              raise RuntimeError('Smart Connect pre-wait block not found')
          s = s.replace(old, new, 1)

          old = '''            val generation = mainViewModel.realPingGeneration\n            val deadline = SystemClock.elapsedRealtime() + SMART_CONNECT_TIMEOUT_MS\n            smartCountdownSeconds = SMART_CONNECT_TIMEOUT_SECONDS\n            refreshSelectedServerUi()\n\n            val countdownJob = launch {\n                while (isActive) {\n                    val remaining = deadline - SystemClock.elapsedRealtime()\n                    if (remaining <= 0L) break\n                    smartCountdownSeconds = ceil(remaining / 1000.0).toInt().coerceAtLeast(1)\n                    refreshSelectedServerUi()\n                    delay(100L)\n                }\n            }\n\n            // IMPORTANT: Smart Connect uses the native v2rayNG 2.2.6 Real Ping service.\n            mainViewModel.testAllRealPing()\n            val finished = withTimeoutOrNull(SMART_CONNECT_TIMEOUT_MS) {\n                while (mainViewModel.realPingGeneration == generation) delay(40L)\n                true\n            } ?: false\n'''
          new = '''            val generation = mainViewModel.realPingGeneration\n            val remainingForPing = (smartDeadline - SystemClock.elapsedRealtime()).coerceAtLeast(0L)\n            if (remainingForPing <= 0L) {\n                markSmartConnectFailed()\n                return@launch\n            }\n            smartCountdownSeconds = ceil(remainingForPing / 1000.0).toInt().coerceIn(1, SMART_CONNECT_TIMEOUT_SECONDS)\n            refreshSelectedServerUi()\n\n            val countdownJob = launch {\n                while (isActive) {\n                    val remaining = smartDeadline - SystemClock.elapsedRealtime()\n                    if (remaining <= 0L) break\n                    smartCountdownSeconds = ceil(remaining / 1000.0).toInt().coerceAtLeast(1)\n                    refreshSelectedServerUi()\n                    delay(100L)\n                }\n            }\n\n            // IMPORTANT: Smart Connect uses the native v2rayNG 2.2.6 Real Ping service.\n            mainViewModel.testAllRealPing()\n            val finished = withTimeoutOrNull(remainingForPing) {\n                while (mainViewModel.realPingGeneration == generation) delay(40L)\n                true\n            } ?: false\n'''
          if old not in s:
              raise RuntimeError('Smart Connect Real Ping timeout block not found')
          s = s.replace(old, new, 1)
          s = s.replace('            delay(120L)\n            requestVpnPermissionAndStart(true)', '            requestVpnPermissionAndStart(true)', 1)
          s = s.replace('                delay(7_000L)\n                if (smartConnecting', '                delay(6_000L)\n                if (smartConnecting', 1)

          old = '''    private fun handlePingClick() {\n        val guid = MmkvManager.getSelectServer().orEmpty()\n        if (guid.isBlank() || smartConnecting) return\n        binding.tvAutoPing.setText(R.string.mobiletina_testing)\n        if (mainViewModel.isRunning.value == true) {\n            mainViewModel.testCurrentServerRealPing()\n        } else {\n            mainViewModel.testServerRealPing(guid)\n        }\n    }\n'''
          new = '''    private fun handlePingClick() {\n        val guid = MmkvManager.getSelectServer().orEmpty()\n        if (guid.isBlank() || smartConnecting) return\n        val running = mainViewModel.isRunning.value == true\n        if (currentMode == MODE_MANUAL) {\n            binding.tvManualPing.setText(R.string.mobiletina_testing)\n        } else {\n            binding.tvAutoPing.setText(R.string.mobiletina_testing)\n        }\n        if (running) {\n            lastConnectedPing = null\n            mainViewModel.testCurrentServerRealPing()\n        } else {\n            mainViewModel.testServerRealPing(guid)\n        }\n    }\n'''
          if old not in s:
              raise RuntimeError('handlePingClick block not found')
          s = s.replace(old, new, 1)

          old = '        binding.tvManualPing.text = pingLabel(ping)\n'
          new = '''        binding.tvManualPing.text = when {\n            running && !lastConnectedPing.isNullOrBlank() -> lastConnectedPing\n            else -> pingLabel(ping)\n        }\n'''
          if old not in s:
              raise RuntimeError('manual ping display line not found')
          s = s.replace(old, new, 1)

          # Clear stale live ping when a fresh connection attempt begins or ends.
          s = s.replace('''        manualConnecting = true\n        refreshSelectedServerUi()''', '''        manualConnecting = true\n        lastConnectedPing = null\n        refreshSelectedServerUi()''', 1)
          s = s.replace('''        smartConnecting = true\n        smartConnectionFailed = false''', '''        smartConnecting = true\n        lastConnectedPing = null\n        smartConnectionFailed = false''', 1)
          s = s.replace('''    fun restartV2Ray() {\n        if (mainViewModel.isRunning.value == true)''', '''    fun restartV2Ray() {\n        lastConnectedPing = null\n        if (mainViewModel.isRunning.value == true)''', 1)
          old = '''            } else {\n                MobileTinaSessionLimiter.cancel(this)\n            }\n            refreshSelectedServerUi()\n'''
          new = '''            } else {\n                MobileTinaSessionLimiter.cancel(this)\n                lastConnectedPing = null\n            }\n            refreshSelectedServerUi()\n'''
          if old not in s:
              raise RuntimeError('running observer block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 4) Real Ping / speed-test service must not show a foreground progress notification.
          # Restore MobileTina's original background test-service behavior while keeping the 2.2.6 worker/Core.
          path = 'V2rayNG/app/src/main/java/com/v2ray/ang/util/MessageUtil.kt'
          p = Path(path)
          s = p.read_text(encoding='utf-8')
          s = s.replace('import android.os.Build\n', '')
          s = s.replace('import androidx.core.content.ContextCompat\n', '')
          old = '''                AppConfig.MSG_MEASURE_CONFIG_START -> {\n                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {\n                        ContextCompat.startForegroundService(ctx, intent)\n                    } else {\n                        ctx.startService(intent)\n                    }\n                }\n'''
          new = '''                AppConfig.MSG_MEASURE_CONFIG_START -> {\n                    // MobileTina launches Real Ping only from foreground UI flows.\n                    // Using a normal started service avoids the intrusive speed-test notification.\n                    ctx.startService(intent)\n                }\n'''
          if old not in s:
              raise RuntimeError('MessageUtil foreground test-service block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          path = 'V2rayNG/app/src/main/java/com/v2ray/ang/service/CoreTestService.kt'
          p = Path(path)
          s = p.read_text(encoding='utf-8')
          s = s.replace('import com.v2ray.ang.R\n', '')
          s = s.replace('import com.v2ray.ang.enums.NotificationChannelType\n', '')
          s = s.replace('import com.v2ray.ang.util.NotificationHelper\n', '')
          for line in [
              '        NotificationHelper.stopForeground(this)\n',
              '                NotificationHelper.stopForeground(this); stopSelf(startId)\n',
          ]:
              s = s.replace(line, '                stopSelf(startId)\n' if '; stopSelf' in line else '')
          start_notification = '''        NotificationHelper.startForeground(\n            this,\n            NotificationChannelType.CORE_TEST,\n            getString(R.string.app_name),\n            getString(R.string.title_real_ping_all_server)\n        )\n\n'''
          if start_notification not in s:
              raise RuntimeError('CoreTestService start notification block not found')
          s = s.replace(start_notification, '', 1)
          progress_notification = '''                NotificationHelper.updateNotification(\n                    channelType = NotificationChannelType.CORE_TEST,\n                    context = this,\n                    content = getString(R.string.connection_runing_task_left, event.text)\n                )\n'''
          if progress_notification not in s:
              raise RuntimeError('CoreTestService progress notification block not found')
          s = s.replace(progress_notification, '', 1)
          s = s.replace('''                if (activeWorkers.isEmpty()) {\n                    NotificationHelper.stopForeground(this)\n                    stopSelf()\n                }''', '''                if (activeWorkers.isEmpty()) {\n                    stopSelf()\n                }''', 1)
          s = s.replace('''        activeWorkers.clear()\n        NotificationHelper.stopForeground(this)\n        stopSelf()''', '''        activeWorkers.clear()\n        stopSelf()''', 1)
          p.write_text(s, encoding='utf-8')

      - name: Validate requested behavior
        run: |
          set -euo pipefail
          grep -q 'android:defaultValue="true"' V2rayNG/app/src/main/res/xml/pref_settings.xml
          grep -A4 'pref_sniffing_enabled' V2rayNG/app/src/main/res/xml/pref_settings.xml | grep -q 'defaultValue="false"'
          ! grep -q 'pref_root_mode_enabled' V2rayNG/app/src/main/res/xml/pref_settings.xml
          ! grep -q 'pref_root_lan_sharing' V2rayNG/app/src/main/res/xml/pref_settings.xml
          ! grep -q 'RootManager' V2rayNG/app/src/main/java/com/v2ray/ang/ui/SettingsActivity.kt
          grep -q 'PREF_SNIFFING_ENABLED, false' V2rayNG/app/src/main/java/com/v2ray/ang/core/CoreConfigManager.kt
          grep -q 'smartDeadline = SystemClock.elapsedRealtime() + SMART_CONNECT_TIMEOUT_MS' V2rayNG/app/src/main/java/com/v2ray/ang/ui/MainActivity.kt
          ! grep -q 'withTimeoutOrNull(8_000L)' V2rayNG/app/src/main/java/com/v2ray/ang/ui/MainActivity.kt
          grep -q 'binding.tvManualPing.setText(R.string.mobiletina_testing)' V2rayNG/app/src/main/java/com/v2ray/ang/ui/MainActivity.kt
          grep -q 'running && !lastConnectedPing.isNullOrBlank()' V2rayNG/app/src/main/java/com/v2ray/ang/ui/MainActivity.kt
          ! grep -q 'NotificationHelper' V2rayNG/app/src/main/java/com/v2ray/ang/service/CoreTestService.kt
          ! grep -q 'startForegroundService' V2rayNG/app/src/main/java/com/v2ray/ang/util/MessageUtil.kt

      - name: Commit fixes
        run: |
          git config user.name "VPN963"
          git config user.email "120357728+VPN963@users.noreply.github.com"
          git add V2rayNG/app/src/main/res/xml/pref_settings.xml \
                  V2rayNG/app/src/main/java/com/v2ray/ang/core/CoreConfigManager.kt \
                  V2rayNG/app/src/main/java/com/v2ray/ang/ui/SettingsActivity.kt \
                  V2rayNG/app/src/main/java/com/v2ray/ang/AngApplication.kt \
                  V2rayNG/app/src/main/java/com/v2ray/ang/ui/MainActivity.kt \
                  V2rayNG/app/src/main/java/com/v2ray/ang/util/MessageUtil.kt \
                  V2rayNG/app/src/main/java/com/v2ray/ang/service/CoreTestService.kt
          git diff --cached --check
          git commit -m "Fix MobileTina scanner ping timing and test UI"
          git push origin HEAD:agent/mobiletina-2.2.6-port
