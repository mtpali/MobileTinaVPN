name: One-shot source hardening

on:
  push:
    branches:
      - agent/mobiletina-2.2.6-port

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Rewrite remaining readable social marker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('V2rayNG/app/src/main/java/com/v2ray/ang/ui/MainActivity.kt')
          s = p.read_text()
          old = 'private const val DEFAULT_SUBSCRIPTION_NAME = "instagram : mobile.tina"'
          new = 'private val DEFAULT_SUBSCRIPTION_NAME = intArrayOf(105,110,115,116,97,103,114,97,109,32,58,32,109,111,98,105,108,101,46,116,105,110,97).map { it.toChar() }.joinToString("")'
          if old in s:
              p.write_text(s.replace(old, new, 1))
          elif new not in s:
              raise SystemExit('expected marker definition not found')
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V2rayNG/app/src/main/java/com/v2ray/ang/ui/MainActivity.kt
          git commit -m 'harden: encode remaining social marker literal'
          git push origin HEAD:agent/mobiletina-2.2.6-port
