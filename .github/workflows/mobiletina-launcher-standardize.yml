name: Standardize MobileTina launcher icon

on:
  push:
    branches:
      - agent/mobiletina-2.2.6-port
    paths:
      - .github/workflows/mobiletina-launcher-standardize.yml

permissions:
  contents: write

jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/mobiletina-2.2.6-port
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate legacy and adaptive launcher icons
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image, ImageFilter

          root = Path('V2rayNG/app/src/main/res')
          src_path = root / 'drawable-nodpi/mobiletina_launcher_source.webp'
          if not src_path.exists():
              raise RuntimeError(f'Missing valid launcher source: {src_path}')

          src = Image.open(src_path).convert('RGBA')
          if src.size != (512, 512):
              src = src.resize((512, 512), Image.Resampling.LANCZOS)

          # Build a transparent adaptive foreground from the red logo while
          # retaining the white outline immediately around it.
          pixels = list(src.getdata())
          mask_values = []
          for r, g, b, a in pixels:
              is_red = a > 0 and r > 170 and g < 145 and b < 175 and r > g + 40
              mask_values.append(255 if is_red else 0)
          red_mask = Image.new('L', src.size)
          red_mask.putdata(mask_values)
          outline_mask = red_mask.filter(ImageFilter.MaxFilter(13))

          logo = src.copy()
          logo.putalpha(outline_mask)
          bbox = logo.getbbox()
          if not bbox:
              raise RuntimeError('Unable to detect launcher logo')
          logo_crop = logo.crop(bbox)

          legacy_sizes = {
              'mdpi': 48,
              'hdpi': 72,
              'xhdpi': 96,
              'xxhdpi': 144,
              'xxxhdpi': 192,
          }
          foreground_sizes = {
              'mdpi': 108,
              'hdpi': 162,
              'xhdpi': 216,
              'xxhdpi': 324,
              'xxxhdpi': 432,
          }

          # Pre-Android 8 / legacy launcher icons: polished full icon.
          for density, size in legacy_sizes.items():
              folder = root / f'mipmap-{density}'
              folder.mkdir(parents=True, exist_ok=True)
              icon = src.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder / 'ic_launcher.png', 'PNG', optimize=True)
              icon.save(folder / 'ic_launcher_round.png', 'PNG', optimize=True)

          # Android 8+ adaptive foreground. Keep artwork well inside the
          # adaptive safe zone so circle/squircle masks never cut the logo.
          for density, size in foreground_sizes.items():
              folder = root / f'mipmap-{density}'
              folder.mkdir(parents=True, exist_ok=True)
              safe = int(size * 0.66)
              scale = min(safe / logo_crop.width, safe / logo_crop.height)
              width = max(1, int(logo_crop.width * scale))
              height = max(1, int(logo_crop.height * scale))
              resized = logo_crop.resize((width, height), Image.Resampling.LANCZOS)
              canvas = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              x = (size - width) // 2
              y = (size - height) // 2 - max(1, int(size * 0.008))
              canvas.alpha_composite(resized, (x, y))
              canvas.save(folder / 'ic_launcher_foreground.png', 'PNG', optimize=True)

          # Ensure the adaptive icon definitions remain standard Android resources.
          anydpi = root / 'mipmap-anydpi-v26'
          anydpi.mkdir(parents=True, exist_ok=True)
          (anydpi / 'ic_launcher.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '    <background android:drawable="@color/ic_launcher_background" />\n'
              '    <foreground android:drawable="@mipmap/ic_launcher_foreground" />\n'
              '    <monochrome android:drawable="@mipmap/ic_launcher_foreground" />\n'
              '</adaptive-icon>\n',
              encoding='utf-8'
          )
          (anydpi / 'ic_launcher_round.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '    <background android:drawable="@color/ic_launcher_background" />\n'
              '    <foreground android:drawable="@mipmap/ic_launcher_foreground" />\n'
              '    <monochrome android:drawable="@mipmap/ic_launcher_foreground" />\n'
              '</adaptive-icon>\n',
              encoding='utf-8'
          )

          bg = root / 'values/ic_launcher_background.xml'
          bg.write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              '    <color name="ic_launcher_background">#FFFFFF</color>\n'
              '</resources>\n',
              encoding='utf-8'
          )

          # Remove the previously broken direct drawable and temporary source.
          broken = root / 'drawable-nodpi/mobiletina_launcher_icon.webp'
          if broken.exists():
              broken.unlink()
          src_path.unlink()

          # Remove temporary workflows used while fixing the binary upload path.
          for wf in [
              Path('.github/workflows/mobiletina-icon-fix-temp.yml'),
              Path('.github/workflows/mobiletina-icon-real-upload.yml'),
              Path('.github/workflows/mobiletina-launcher-standardize.yml'),
          ]:
              if wf.exists():
                  wf.unlink()

      - name: Verify generated icon resources
        shell: bash
        run: |
          set -euo pipefail
          file V2rayNG/app/src/main/res/mipmap-mdpi/ic_launcher.png
          file V2rayNG/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          file V2rayNG/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          grep -q '@mipmap/ic_launcher' V2rayNG/app/src/playstore/AndroidManifest.xml
          grep -q 'فیلترشکن' V2rayNG/app/src/playstore/res/values/mobiletina_brand.xml

      - name: Commit standardized launcher icon
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MobileTina CI"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Android launcher icon resources"
          git push origin HEAD:agent/mobiletina-2.2.6-port
