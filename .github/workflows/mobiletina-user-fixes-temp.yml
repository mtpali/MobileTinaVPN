name: MobileTina user fixes patch

on:
  push:
    branches:
      - agent/mobiletina-2.2.6-port
    paths:
      - .github/workflows/mobiletina-user-fixes-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/mobiletina-2.2.6-port
          fetch-depth: 0

      - name: Apply requested MobileTina fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          main = root / 'V2rayNG/app/src/main/java/com/v2ray/ang/ui/MainActivity.kt'
          compat = root / 'V2rayNG/app/src/main/java/com/v2ray/ang/ui/MobileTina226Compat.kt'
          layout = root / 'V2rayNG/app/src/main/res/layout/activity_main.xml'
          day = root / 'V2rayNG/app/src/main/res/values/mobiletina_colors.xml'
          night = root / 'V2rayNG/app/src/main/res/values-night/mobiletina_colors.xml'
          strings = root / 'V2rayNG/app/src/main/res/values/strings.xml'

          s = main.read_text(encoding='utf-8')

          # Imports for visible local group migration.
          anchor = 'import com.v2ray.ang.dto.entities.SubscriptionItem\n'
          if anchor not in s:
              s = s.replace('import com.v2ray.ang.enums.EConfigType\n', 'import com.v2ray.ang.enums.EConfigType\nimport com.v2ray.ang.dto.entities.SubscriptionItem\n', 1)
          if 'import com.v2ray.ang.util.JsonUtil\n' not in s:
              s = s.replace('import com.v2ray.ang.util.MobileTinaImportNormalizer\n', 'import com.v2ray.ang.util.JsonUtil\nimport com.v2ray.ang.util.MobileTinaImportNormalizer\n', 1)

          # Dialog state.
          old = '    private var manualPrewarmJob: kotlinx.coroutines.Job? = null\n'
          new = old + '    private var internetDialog: AlertDialog? = null\n    private val internetDialogHandler = Handler(Looper.getMainLooper())\n'
          if 'private var internetDialog: AlertDialog?' not in s:
              assert old in s
              s = s.replace(old, new, 1)

          # Manual FAB: make sure a single imported server is selected before direct start.
          old = '''        if (smartConnecting || manualConnecting) return\n\n        manualConnecting = true\n'''
          new = '''        if (smartConnecting || manualConnecting) return\n\n        ensureSelectedServerForCurrentSubscription()\n        if (MmkvManager.getSelectServer().isNullOrBlank()) {\n            mainViewModel.currentServerGuids().singleOrNull()?.let(MmkvManager::setSelectServer)\n        }\n        manualConnecting = true\n'''
          assert old in s
          s = s.replace(old, new, 1)

          # Smart Connect: synchronous one-server fast path before any countdown job starts.
          old = '''        if (smartConnecting) {\n            cancelSmartConnect()\n            return\n        }\n\n        smartConnecting = true\n'''
          new = '''        if (smartConnecting) {\n            cancelSmartConnect()\n            return\n        }\n\n        ensureSelectedServerForCurrentSubscription()\n        val immediateServer = mainViewModel.currentServerGuids().singleOrNull()\n        if (immediateServer != null) {\n            smartConnectJob?.cancel()\n            mainViewModel.cancelRealPing()\n            MmkvManager.setSelectServer(immediateServer)\n            smartConnecting = true\n            lastConnectedPing = null\n            smartConnectionFailed = false\n            smartCountdownSeconds = 0\n            refreshSelectedServerUi()\n            requestVpnPermissionAndStart(true)\n            return\n        }\n\n        smartConnecting = true\n'''
          assert old in s
          s = s.replace(old, new, 1)

          # Raise subscription card slightly while connected without changing normal/off layout.
          old = '        binding.fab.setImageResource(\n            if (running) R.drawable.mt_manual_fab else R.drawable.mt_manual_stop\n        )\n        refreshSubscriptionCard()\n'
          new = '        binding.fab.setImageResource(\n            if (running) R.drawable.mt_manual_fab else R.drawable.mt_manual_stop\n        )\n        binding.subscriptionCard.translationY = if (running) -12f * resources.displayMetrics.density else 0f\n        refreshSubscriptionCard()\n'
          assert old in s
          s = s.replace(old, new, 1)

          # Offline warning: transient dialog instead of toast.
          old = '''    private fun updateSubscriptionOnResume() {\n        if (!hasInternetConnection()) {\n            toast(R.string.mobiletina_enable_internet)\n            return\n        }\n'''
          new = '''    private fun updateSubscriptionOnResume() {\n        if (!hasInternetConnection()) {\n            showInternetRequiredDialog()\n            return\n        }\n        internetDialogHandler.removeCallbacksAndMessages(null)\n        internetDialog?.dismiss()\n        internetDialog = null\n'''
          assert old in s
          s = s.replace(old, new, 1)

          insert_before = '''    private fun refreshSubscriptionsSilently() {\n'''
          dialog_fn = '''    private fun showInternetRequiredDialog() {\n        if (isFinishing || isDestroyed || internetDialog?.isShowing == true) return\n        internetDialog = AlertDialog.Builder(this)\n            .setMessage(R.string.mobiletina_enable_internet)\n            .create()\n            .also { dialog ->\n                dialog.setOnDismissListener {\n                    if (internetDialog === dialog) internetDialog = null\n                }\n                dialog.show()\n                internetDialogHandler.postDelayed({\n                    if (dialog.isShowing) dialog.dismiss()\n                }, INTERNET_DIALOG_DURATION_MS)\n            }\n    }\n\n'''
          if 'private fun showInternetRequiredDialog()' not in s:
              assert insert_before in s
              s = s.replace(insert_before, dialog_fn + insert_before, 1)

          # Direct imports: migrate ungrouped DEFAULT configs into a visible local group.
          old = '''                    when {\n                        count > 0 -> {\n                            toast(getString(R.string.title_import_config_count, count))\n                            mainViewModel.reloadServerList()\n                        }\n'''
          new = '''                    when {\n                        count > 0 -> {\n                            ensureImportedConfigsHaveVisibleGroup()\n                            toast(getString(R.string.title_import_config_count, count))\n                            setupGroupTab()\n                            mainViewModel.reloadServerList()\n                            ensureSelectedServerForCurrentSubscription()\n                        }\n'''
          assert old in s
          s = s.replace(old, new, 1)

          insert_before = '''    private fun locateSelectedServer() {\n'''
          migrate_fn = '''    private fun ensureImportedConfigsHaveVisibleGroup() {\n        val defaultServers = MmkvManager.decodeServerList(AppConfig.DEFAULT_SUBSCRIPTION_ID)\n        if (defaultServers.isEmpty()) return\n\n        val currentId = mainViewModel.subscriptionId\n            .takeIf { it.isNotBlank() && it != AppConfig.DEFAULT_SUBSCRIPTION_ID }\n        val existingId = MmkvManager.decodeSubscriptions()\n            .firstOrNull { it.guid != AppConfig.DEFAULT_SUBSCRIPTION_ID }\n            ?.guid\n        val targetId = currentId ?: existingId ?: Utils.getUuid().also { newId ->\n            MmkvManager.encodeSubscription(\n                newId,\n                SubscriptionItem(remarks = DEFAULT_SUBSCRIPTION_NAME, enabled = true, autoUpdate = false)\n            )\n        }\n\n        val merged = (MmkvManager.decodeServerList(targetId) + defaultServers).distinct().toMutableList()\n        defaultServers.forEach { guid ->\n            MmkvManager.decodeServerConfig(guid)?.let { profile ->\n                profile.subscriptionId = targetId\n                MmkvManager.encodeProfileDirect(guid, JsonUtil.toJson(profile))\n            }\n        }\n        MmkvManager.encodeServerList(merged, targetId)\n        MmkvManager.encodeServerList(mutableListOf(), AppConfig.DEFAULT_SUBSCRIPTION_ID)\n        mainViewModel.subscriptionIdChanged(targetId)\n        if (MmkvManager.getSelectServer().isNullOrBlank()) {\n            merged.firstOrNull()?.let(MmkvManager::setSelectServer)\n        }\n    }\n\n'''
          if 'private fun ensureImportedConfigsHaveVisibleGroup()' not in s:
              assert insert_before in s
              s = s.replace(insert_before, migrate_fn + insert_before, 1)

          # Clean dialog callbacks on destroy and add 3-second constant.
          old = '''    override fun onDestroy() {\n        tabMediator?.detach()\n        super.onDestroy()\n    }\n'''
          new = '''    override fun onDestroy() {\n        internetDialogHandler.removeCallbacksAndMessages(null)\n        internetDialog?.dismiss()\n        internetDialog = null\n        tabMediator?.detach()\n        super.onDestroy()\n    }\n'''
          assert old in s
          s = s.replace(old, new, 1)
          if 'INTERNET_DIALOG_DURATION_MS' not in s[s.index('companion object'):]:
              s = s.replace('        private const val SMART_CONNECT_TIMEOUT_MS = 6_000L\n', '        private const val SMART_CONNECT_TIMEOUT_MS = 6_000L\n        private const val INTERNET_DIALOG_DURATION_MS = 3_000L\n', 1)

          main.write_text(s, encoding='utf-8')

          # Real-ping bridge: fallback to persisted list so a freshly imported single server is immediately visible to Smart Connect.
          s = compat.read_text(encoding='utf-8')
          old = 'fun MainViewModel.currentServerGuids(): List<String> = serversCache.map { it.guid }\n'
          new = '''fun MainViewModel.currentServerGuids(): List<String> {\n    val cached = serversCache.map { it.guid }\n    if (cached.isNotEmpty()) return cached\n    return if (subscriptionId.isBlank()) {\n        MmkvManager.decodeAllServerList()\n    } else {\n        MmkvManager.decodeServerList(subscriptionId)\n    }\n}\n'''
          assert old in s
          compat.write_text(s.replace(old, new, 1), encoding='utf-8')

          # Layout: theme-aware Smart Connect button; compact dock while preserving FAB/button top positions.
          s = layout.read_text(encoding='utf-8')
          s = s.replace('android:layout_height="168dp"\n                    android:background="@color/mobiletina_manual_dock_bg"', 'android:layout_height="156dp"\n                    android:background="@color/mobiletina_manual_dock_bg"', 1)
          s = s.replace('android:layout_height="122dp"\n                        android:layout_gravity="bottom"', 'android:layout_height="110dp"\n                        android:layout_gravity="bottom"', 1)
          s = s.replace('android:backgroundTint="#1976D2"', 'android:backgroundTint="@color/mobiletina_smart_connect_bg"', 1)
          s = s.replace('android:textColor="@android:color/white"\n                        android:textSize="16sp"\n                        app:cornerRadius="25dp"', 'android:textColor="@color/mobiletina_smart_connect_text"\n                        android:textSize="16sp"\n                        app:cornerRadius="25dp"\n                        app:strokeColor="@color/mobiletina_smart_connect_stroke"\n                        app:strokeWidth="1dp"', 1)
          s = s.replace('android:layout_marginTop="144dp"\n                        android:gravity="center"', 'android:layout_marginTop="132dp"\n                        android:gravity="center"', 1)
          s = s.replace('app:indicatorColor="#C8C8C8"\n                                app:trackColor="#54545A"', 'app:indicatorColor="@color/mobiletina_subscription_progress_indicator"\n                                app:trackColor="@color/mobiletina_subscription_progress_track"', 1)
          layout.write_text(s, encoding='utf-8')

          # Day/night colors.
          s = day.read_text(encoding='utf-8')
          if 'mobiletina_smart_connect_bg' not in s:
              s = s.replace('</resources>', '''    <color name="mobiletina_smart_connect_bg">#FFFFFF</color>\n    <color name="mobiletina_smart_connect_text">#1C1B1F</color>\n    <color name="mobiletina_smart_connect_stroke">#C8C8C8</color>\n    <color name="mobiletina_subscription_progress_indicator">#54545A</color>\n    <color name="mobiletina_subscription_progress_track">#C8C8C8</color>\n</resources>''')
          day.write_text(s, encoding='utf-8')

          s = night.read_text(encoding='utf-8')
          if 'mobiletina_smart_connect_bg' not in s:
              s = s.replace('</resources>', '''    <color name="mobiletina_smart_connect_bg">#000000</color>\n    <color name="mobiletina_smart_connect_text">#FFFFFF</color>\n    <color name="mobiletina_smart_connect_stroke">#54545A</color>\n    <color name="mobiletina_subscription_progress_indicator">#C8C8C8</color>\n    <color name="mobiletina_subscription_progress_track">#54545A</color>\n</resources>''')
          night.write_text(s, encoding='utf-8')

          # Persian import result and Cancel label.
          s = strings.read_text(encoding='utf-8')
          s, n = re.subn(r'<string name="title_import_config_count">.*?</string>', '<string name="title_import_config_count">تعداد %d کانفیگ اضافه شد</string>', s, count=1)
          assert n == 1
          if 'name="mobiletina_cancel"' not in s:
              s = s.replace('</resources>', '    <string name="mobiletina_cancel">بیخیال</string>\n</resources>')
          strings.write_text(s, encoding='utf-8')

          # Replace Android's English Cancel in Kotlin dialogs with project-owned Persian label.
          java_root = root / 'V2rayNG/app/src/main/java'
          cancel_files = []
          for p in java_root.rglob('*.kt'):
              text = p.read_text(encoding='utf-8')
              if 'android.R.string.cancel' not in text:
                  continue
              if 'import com.v2ray.ang.R' not in text and not text.startswith('package com.v2ray.ang\n'):
                  package_end = text.find('\n')
                  text = text[:package_end+1] + 'import com.v2ray.ang.R\n' + text[package_end+1:]
              text = text.replace('android.R.string.cancel', 'R.string.mobiletina_cancel')
              p.write_text(text, encoding='utf-8')
              cancel_files.append(str(p))
          print('Cancel replacements:', len(cancel_files))
          for p in cancel_files:
              print(' -', p)

      - name: Commit source-only changes
        run: |
          set -euo pipefail
          git config user.name "MobileTina CI"
          git config user.email "actions@github.com"
          git rm -f .github/workflows/mobiletina-user-fixes-temp.yml
          git add V2rayNG/app/src/main/java V2rayNG/app/src/main/res/layout/activity_main.xml V2rayNG/app/src/main/res/values/mobiletina_colors.xml V2rayNG/app/src/main/res/values-night/mobiletina_colors.xml V2rayNG/app/src/main/res/values/strings.xml
          git diff --cached --check
          git commit -m "Fix single imports and polish MobileTina UI"
          git push origin HEAD:agent/mobiletina-2.2.6-port
