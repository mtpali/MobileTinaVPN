name: MobileTina icon scale and auto FAB temp

on:
  push:
    branches:
      - agent/mobiletina-2.2.6-port
    paths:
      - .github/workflows/mobiletina-icon-scale-fab-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/mobiletina-2.2.6-port
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Reduce launcher artwork and lower Auto FAB
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image

          root = Path('V2rayNG/app/src/main/res')
          densities = {
              'mdpi': (108, 48),
              'hdpi': (162, 72),
              'xhdpi': (216, 96),
              'xxhdpi': (324, 144),
              'xxxhdpi': (432, 192),
          }

          for density, (fg_size, legacy_size) in densities.items():
              folder = root / f'mipmap-{density}'
              fg_path = folder / 'ic_launcher_foreground.png'
              if not fg_path.exists():
                  raise RuntimeError(f'Missing {fg_path}')

              original_fg = Image.open(fg_path).convert('RGBA')
              if original_fg.size != (fg_size, fg_size):
                  original_fg = original_fg.resize((fg_size, fg_size), Image.Resampling.LANCZOS)

              # Legacy launcher icon: white background with the existing foreground
              # centered at its previous scale. This removes the oversized full-bleed
              # source while keeping the logo readable on pre-adaptive launchers.
              legacy_canvas = Image.new('RGBA', (fg_size, fg_size), (255, 255, 255, 255))
              legacy_canvas.alpha_composite(original_fg)
              legacy = legacy_canvas.resize((legacy_size, legacy_size), Image.Resampling.LANCZOS)
              legacy.save(folder / 'ic_launcher.png', 'PNG', optimize=True)
              legacy.save(folder / 'ic_launcher_round.png', 'PNG', optimize=True)

              # Adaptive icon foreground: reduce the whole foreground canvas to 76%
              # so the red mark gets substantially more breathing room inside the
              # launcher mask on Android 8+.
              scale = 0.76
              scaled_size = max(1, int(round(fg_size * scale)))
              scaled = original_fg.resize((scaled_size, scaled_size), Image.Resampling.LANCZOS)
              adaptive_canvas = Image.new('RGBA', (fg_size, fg_size), (0, 0, 0, 0))
              x = (fg_size - scaled_size) // 2
              y = (fg_size - scaled_size) // 2
              adaptive_canvas.alpha_composite(scaled, (x, y))
              adaptive_canvas.save(fg_path, 'PNG', optimize=True)

          layout = root / 'layout/activity_main.xml'
          text = layout.read_text(encoding='utf-8')
          old = 'android:paddingTop="82dp"'
          new = 'android:paddingTop="94dp"'
          if old not in text:
              raise RuntimeError('Expected Auto panel top padding not found')
          layout.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Remove this temporary workflow from the final branch state.
          Path('.github/workflows/mobiletina-icon-scale-fab-temp.yml').unlink()

      - name: Verify changes
        shell: bash
        run: |
          set -euo pipefail
          file V2rayNG/app/src/main/res/mipmap-mdpi/ic_launcher.png
          file V2rayNG/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          grep -q 'android:paddingTop="94dp"' V2rayNG/app/src/main/res/layout/activity_main.xml
          grep -q '@mipmap/ic_launcher' V2rayNG/app/src/playstore/AndroidManifest.xml

      - name: Commit requested icon and Auto FAB changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MobileTina CI"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --check
          git commit -m "Reduce launcher icon scale and lower Auto FAB"
          git push origin HEAD:agent/mobiletina-2.2.6-port
