name: MobileTina 2.2.6 Max Obfuscated ARM Release

on:
  push:
    branches:
      - agent/mobiletina-2.2.6-port
  workflow_dispatch:

jobs:
  hardened-split-arm:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify hardening contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.v2ray.mobiletina"' V2rayNG/app/build.gradle.kts
          grep -q 'FINAL_HARDENED_BUILD' V2rayNG/app/build.gradle.kts
          grep -q 'isMinifyEnabled = true' V2rayNG/app/build.gradle.kts
          grep -q 'isShrinkResources = true' V2rayNG/app/build.gradle.kts
          grep -q -- '-repackageclasses' V2rayNG/app/proguard-rules.pro
          grep -q 'class go\.\*\*' V2rayNG/app/proguard-rules.pro
          grep -q 'class libv2ray\.\*\*' V2rayNG/app/proguard-rules.pro
          grep -q 'RuntimeUriVault.resolve' V2rayNG/app/src/main/java/com/v2ray/ang/ui/MobileTinaStoreAboutActivity.kt
          ! grep -R -Fq 'https://www.instagram.com/mobile.tina/' V2rayNG/app/src/main/java V2rayNG/app/src/main/res
          ! grep -R -Fq 'https://www.instagram.com/mobile.tina2/' V2rayNG/app/src/main/java V2rayNG/app/src/main/res
          ! grep -R -Fq 'https://www.instagram.com/mobile.tinaa/' V2rayNG/app/src/main/java V2rayNG/app/src/main/res
          ! grep -R -Fq 'https://t.me/vpn963' V2rayNG/app/src/main/java V2rayNG/app/src/main/res

      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK 29
        shell: bash
        run: |
          set -euo pipefail
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=0 --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('V2rayNG/app/build.gradle.kts')
          s = p.read_text()
          if 'ndkVersion = "29.0.14206865"' not in s:
              s = s.replace('android {\n', 'android {\n    ndkVersion = "29.0.14206865"\n', 1)
              p.write_text(s)
          PY

      - name: Restore libhevtun cache
        id: hev-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/libs
          key: mt226-max-hev-${{ runner.os }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Build libhevtun
        if: steps.hev-cache.outputs.cache-hit != 'true'
        run: bash compile-hevtun.sh

      - name: Save libhevtun cache
        if: steps.hev-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/libs
          key: mt226-max-hev-${{ runner.os }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Copy native tunnel libraries
        run: cp -r "${{ github.workspace }}/libs" "${{ github.workspace }}/V2rayNG/app"

      - name: Resolve libv2ray
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pushd AndroidLibXrayLite >/dev/null
          CURRENT_TAG=$(git describe --tags --abbrev=0)
          popd >/dev/null
          gh release download "$CURRENT_TAG" \
            --repo 2dust/AndroidLibXrayLite \
            --pattern 'libv2ray.aar' \
            --dir V2rayNG/app/libs

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Create one hardened signer for both ABIs
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/mobiletina-2.2.6-max-obfuscated.p12"
          STORE_PASSWORD='mobiletina-2.2.6-max-ci'
          KEY_ALIAS='mobiletina_max_hardened'
          KEY_PASSWORD="$STORE_PASSWORD"
          rm -f "$KEYSTORE"
          keytool -genkeypair \
            -storetype PKCS12 \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keypass "$KEY_PASSWORD" \
            -dname 'CN=MobileTina Max Hardened,O=MobileTina,C=IR' \
            -keyalg RSA -keysize 4096 -sigalg SHA256withRSA -validity 10000 -noprompt
          CERT_SHA=$(keytool -exportcert \
            -storetype PKCS12 \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" | sha256sum | awk '{print $1}')
          test ${#CERT_SHA} -eq 64
          echo "CERT_SHA=$CERT_SHA" >> "$GITHUB_ENV"
          echo "HARDENED_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "HARDENED_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "HARDENED_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "HARDENED_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Test and build optimized split ARM releases
        shell: bash
        run: |
          set -euo pipefail
          cd V2rayNG
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          ./gradlew \
            testPlaystoreDebugUnitTest \
            --tests com.v2ray.ang.handler.MobileTinaExpiryManagerTest \
            assemblePlaystoreRelease \
            '-PABI_FILTERS=armeabi-v7a;arm64-v8a' \
            -PFINAL_HARDENED_BUILD=true \
            -PMOBILETINA_EXPECTED_CERT_SHA256="$CERT_SHA" \
            -PFINAL_HARDENED_KEYSTORE="$HARDENED_KEYSTORE" \
            -PFINAL_HARDENED_STORE_PASSWORD="$HARDENED_STORE_PASSWORD" \
            -PFINAL_HARDENED_KEY_ALIAS="$HARDENED_KEY_ALIAS" \
            -PFINAL_HARDENED_KEY_PASSWORD="$HARDENED_KEY_PASSWORD" \
            --no-daemon \
            --stacktrace

      - name: Verify ARMv7 and ARMv8 payloads
        shell: bash
        run: |
          set -euo pipefail
          OUT=V2rayNG/app/build/outputs/apk/playstore/release
          ARM7=$(find "$OUT" -type f -name '*armeabi-v7a*.apk' -print -quit)
          ARM8=$(find "$OUT" -type f -name '*arm64-v8a*.apk' -print -quit)
          test -n "$ARM7"
          test -n "$ARM8"

          verify_apk() {
            local apk="$1"
            local abi="$2"
            local label="$3"
            echo "Verifying $label: $apk"

            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk" | tee "/tmp/${label}-signer.txt"
            grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "/tmp/${label}-signer.txt"
            grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' "/tmp/${label}-signer.txt"
            local apk_cert
            apk_cert=$(sed -n 's/^.*certificate SHA-256 digest: //p' "/tmp/${label}-signer.txt" | head -n1 | tr -d ':' | tr 'A-F' 'a-f')
            test "$apk_cert" = "$CERT_SHA"

            zipinfo -1 "$apk" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u > "/tmp/${label}-abis.txt"
            printf '%s\n' "$abi" > "/tmp/${label}-expected-abi.txt"
            diff -u "/tmp/${label}-expected-abi.txt" "/tmp/${label}-abis.txt"

            local dex_dir
            dex_dir=$(mktemp -d)
            unzip -q "$apk" 'classes*.dex' -d "$dex_dir"
            find "$dex_dir" -type f -name 'classes*.dex' -print > "/tmp/${label}-dex-files.txt"
            test -s "/tmp/${label}-dex-files.txt"

            has_token() {
              local token="$1"
              while IFS= read -r dex; do
                grep -aFq -- "$token" "$dex" && return 0
              done < "/tmp/${label}-dex-files.txt"
              return 1
            }

            for secret in \
              'https://www.instagram.com/mobile.tina/' \
              'https://www.instagram.com/mobile.tina2/' \
              'https://www.instagram.com/mobile.tinaa/' \
              'https://t.me/vpn963'; do
              if has_token "$secret"; then
                echo "::error::$label leaked protected social destination: $secret"
                exit 1
              fi
            done

            for internal_name in \
              'Lcom/v2ray/ang/ui/RuntimeUriVault;' \
              'Lcom/v2ray/ang/util/MobileTinaIntegrityGuard;' \
              'Lcom/v2ray/ang/util/MobileTinaImportNormalizer;' \
              'Lcom/v2ray/ang/handler/MobileTinaSubscriptionUpdateOptimizer;'; do
              if has_token "$internal_name"; then
                echo "::error::$label retained internal implementation name: $internal_name"
                exit 1
              fi
            done

            for runtime_class in \
              'Lcom/v2ray/ang/core/CoreServiceManager$CoreCallback;' \
              'Lcom/v2ray/ang/core/CoreServiceManager$XrayProcessFinder;' \
              'Lcom/v2ray/ang/service/TProxyService;' \
              'Llibv2ray/CoreController;' \
              'Lgo/Seq;'; do
              has_token "$runtime_class" || { echo "::error::$label missing runtime descriptor: $runtime_class"; exit 1; }
            done

            sha256sum "$apk" > "$OUT/MobileTina-2.2.6-${label}-max-obfuscated.sha256"
          }

          verify_apk "$ARM7" 'armeabi-v7a' 'armv7'
          verify_apk "$ARM8" 'arm64-v8a' 'armv8'

          ARM7_CERT=$(sed -n 's/^.*certificate SHA-256 digest: //p' /tmp/armv7-signer.txt | head -n1 | tr -d ':' | tr 'A-F' 'a-f')
          ARM8_CERT=$(sed -n 's/^.*certificate SHA-256 digest: //p' /tmp/armv8-signer.txt | head -n1 | tr -d ':' | tr 'A-F' 'a-f')
          test "$ARM7_CERT" = "$ARM8_CERT"

          MAPPING=$(find V2rayNG/app/build/outputs/mapping -type f -name mapping.txt -print -quit)
          test -n "$MAPPING"
          test -s "$MAPPING"
          printf 'commit=%s\nsigner_sha256=%s\nmapping_sha256=%s\n' \
            "$GITHUB_SHA" "$CERT_SHA" "$(sha256sum "$MAPPING" | awk '{print $1}')" \
            > "$OUT/MobileTina-2.2.6-max-obfuscated-report.txt"

      - name: Upload ARMv7 hardened APK
        uses: actions/upload-artifact@v7
        with:
          name: MobileTina-2.2.6-ARMv7-max-obfuscated
          path: |
            V2rayNG/app/build/outputs/apk/playstore/release/*armeabi-v7a*.apk
            V2rayNG/app/build/outputs/apk/playstore/release/MobileTina-2.2.6-armv7-max-obfuscated.sha256
            V2rayNG/app/build/outputs/apk/playstore/release/MobileTina-2.2.6-max-obfuscated-report.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload ARMv8 hardened APK
        uses: actions/upload-artifact@v7
        with:
          name: MobileTina-2.2.6-ARMv8-max-obfuscated
          path: |
            V2rayNG/app/build/outputs/apk/playstore/release/*arm64-v8a*.apk
            V2rayNG/app/build/outputs/apk/playstore/release/MobileTina-2.2.6-armv8-max-obfuscated.sha256
            V2rayNG/app/build/outputs/apk/playstore/release/MobileTina-2.2.6-max-obfuscated-report.txt
          if-no-files-found: error
          retention-days: 90
