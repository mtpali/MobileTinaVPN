name: MobileTina unused image cleanup

on:
  pull_request:
    branches:
      - agent/v2rayng-2.2.6-base

permissions:
  contents: write

jobs:
  audit-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/mobiletina-2.2.6-port
          submodules: recursive
          fetch-depth: 0

      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK 29
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=0 --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          python3 - <<'PY'
          from pathlib import Path
          p=Path('V2rayNG/app/build.gradle.kts')
          s=p.read_text()
          if 'ndkVersion = "29.0.14206865"' not in s:
              p.write_text(s.replace('android {\n', 'android {\n    ndkVersion = "29.0.14206865"\n', 1))
          PY

      - name: Restore libhevtun cache
        id: hev-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/libs
          key: mt226-hev-${{ runner.os }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Build libhevtun
        if: steps.hev-cache.outputs.cache-hit != 'true'
        run: bash compile-hevtun.sh

      - name: Copy libhevtun
        run: cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

      - name: Resolve libv2ray tag
        run: |
          pushd AndroidLibXrayLite
          CURRENT_TAG=$(git describe --tags --abbrev=0)
          echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
          popd

      - name: Download matching libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: ${{ env.CURRENT_TAG }}
          fileName: 'libv2ray.aar'
          out-file-path: V2rayNG/app/libs/

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Android Lint for both app flavors
        run: |
          cd V2rayNG
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          ./gradlew lintPlaystoreDebug lintFdroidDebug -PABI_FILTERS=armeabi-v7a || true
          find app/build/reports -maxdepth 2 -type f -name 'lint-results-*.xml' -print

      - name: Remove only doubly-confirmed unused upstream raster images
        shell: python
        run: |
          import re, subprocess, xml.etree.ElementTree as ET
          from pathlib import Path

          repo = Path.cwd()
          app = repo / 'V2rayNG/app'
          base = '15b4fff8e45da9bc0acaa5cc1d80a1d3531e8712'
          raster_exts = {'.png', '.webp', '.jpg', '.jpeg', '.gif'}

          reports = list((app / 'build/reports').rglob('lint-results-*.xml'))
          play = [p for p in reports if 'playstore' in p.name.lower()]
          fdroid = [p for p in reports if 'fdroid' in p.name.lower()]
          if not play or not fdroid:
              raise RuntimeError(f'Expected lint XML reports for both flavors; found: {[str(p) for p in reports]}')

          def unused_rasters(report):
              out = set()
              root = ET.parse(report).getroot()
              for issue in root.findall('issue'):
                  if issue.attrib.get('id') != 'UnusedResources':
                      continue
                  for loc in issue.findall('location'):
                      raw = loc.attrib.get('file', '')
                      p = Path(raw)
                      if not p.is_absolute():
                          p = (app / raw).resolve() if raw.startswith('src/') else (repo / raw).resolve()
                      try:
                          rel = p.relative_to(repo.resolve()).as_posix()
                      except ValueError:
                          continue
                      if Path(rel).suffix.lower() in raster_exts and '/res/' in rel:
                          out.add(rel)
              return out

          unused_play = set.intersection(*(unused_rasters(p) for p in play)) if len(play) > 1 else unused_rasters(play[0])
          unused_fdroid = set.intersection(*(unused_rasters(p) for p in fdroid)) if len(fdroid) > 1 else unused_rasters(fdroid[0])
          candidates = unused_play & unused_fdroid

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', f'{base}..HEAD', '--', 'V2rayNG/app/src'],
              text=True,
          ).splitlines()
          protected = {p for p in changed if Path(p).suffix.lower() in raster_exts}

          def is_custom_protected(path):
              name = Path(path).stem.lower()
              return path in protected or name.startswith('mt_') or name.startswith('ic_launcher') or 'mobiletina' in name

          text_exts = {'.kt', '.java', '.xml', '.kts', '.gradle', '.pro', '.properties', '.txt', '.json'}
          source_text = []
          for p in (app / 'src').rglob('*'):
              if p.is_file() and p.suffix.lower() in text_exts:
                  try:
                      source_text.append(p.read_text(encoding='utf-8', errors='ignore'))
                  except Exception:
                      pass
          corpus = '\n'.join(source_text)

          safe = []
          skipped_custom = []
          skipped_reference = []
          for rel in sorted(candidates):
              if is_custom_protected(rel):
                  skipped_custom.append(rel)
                  continue
              stem = Path(rel).stem
              if re.search(rf'(?<![A-Za-z0-9_]){re.escape(stem)}(?![A-Za-z0-9_])', corpus):
                  skipped_reference.append(rel)
                  continue
              safe.append(rel)

          print('=== Unused in BOTH flavors ===')
          for p in sorted(candidates): print(p)
          print('=== Protected MobileTina/custom images ===')
          for p in skipped_custom: print(p)
          print('=== Kept because a source-text reference exists ===')
          for p in skipped_reference: print(p)
          print('=== SAFE DELETE LIST ===')
          total = 0
          for rel in safe:
              p = repo / rel
              if p.exists():
                  total += p.stat().st_size
                  print(f'{rel}\t{p.stat().st_size} bytes')
                  subprocess.run(['git', 'rm', '-f', rel], check=True)
          print(f'SAFE_DELETE_COUNT={len(safe)}')
          print(f'SAFE_DELETE_BYTES={total}')

      - name: Verify after deletion with both lint variants
        run: |
          cd V2rayNG
          ./gradlew lintPlaystoreDebug lintFdroidDebug -PABI_FILTERS=armeabi-v7a || true

      - name: Build ARMv7 after cleanup
        run: |
          cd V2rayNG
          ./gradlew assemblePlaystoreDebug -PABI_FILTERS=armeabi-v7a

      - name: Commit safe cleanup and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "MobileTina CI"
          git config user.email "actions@github.com"
          git rm -f .github/workflows/mobiletina-unused-images-cleanup-temp.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No repository changes after audit."
            exit 0
          fi
          git commit -m "Remove safely confirmed unused image resources"
          git push origin HEAD:agent/mobiletina-2.2.6-port
