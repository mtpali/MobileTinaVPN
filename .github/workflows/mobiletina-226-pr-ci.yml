name: MobileTina 2.2.6 PR CI

on:
  pull_request:
    branches:
      - agent/v2rayng-2.2.6-base

permissions:
  contents: write

jobs:
  armv7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/mobiletina-2.2.6-port
          submodules: recursive
          fetch-depth: 0

      - name: Persist requested MobileTina source fixes
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')
          main = root / 'V2rayNG/app/src/main/java/com/v2ray/ang/ui/MainActivity.kt'
          share = root / 'V2rayNG/app/src/main/java/com/v2ray/ang/handler/MobileTinaHiddenShareManager.kt'
          layout = root / 'V2rayNG/app/src/main/res/layout/activity_main.xml'
          strings = root / 'V2rayNG/app/src/main/res/values/strings.xml'

          s = share.read_text(encoding='utf-8')
          if '    private fun exportConfig(guid: String): String? {' in s:
              s = s.replace('    private fun exportConfig(guid: String): String? {', '    fun exportConfig(guid: String): String? {', 1)
          assert '    fun exportConfig(guid: String): String? {' in s
          share.write_text(s, encoding='utf-8')

          s = main.read_text(encoding='utf-8')
          old = '''        val subscription = MmkvManager.decodeSubscription(subscriptionId) ?: return
        if (subscription.url.isBlank()) return

        val container = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            setPadding(40, 12, 40, 12)
        }
        QRCodeDecoder.createQRCode(subscription.url)?.let { bitmap ->
            container.addView(ImageView(this).apply {
                setImageBitmap(bitmap)
                adjustViewBounds = true
                layoutParams = LinearLayout.LayoutParams(-1, 520)
            })
        }
        container.addView(Button(this).apply {
            setText(R.string.mobiletina_copy_subscription_link)
            setOnClickListener { Utils.setClipboard(this@MainActivity, subscription.url) }
        })
        container.addView(Button(this).apply {
            setText(R.string.mobiletina_copy_all_configs)
            setOnClickListener { MobileTinaHiddenShareManager.copyAllConfigs(this@MainActivity, subscriptionId) }
        })
'''
          new = '''        val subscription = MmkvManager.decodeSubscription(subscriptionId) ?: return
        val singleServerLink = MmkvManager.decodeServerList(subscriptionId)
            .singleOrNull()
            ?.let(MobileTinaHiddenShareManager::exportConfig)
        val secretContent = singleServerLink ?: subscription.url.takeIf { it.isNotBlank() } ?: return

        val container = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            setPadding(40, 12, 40, 12)
        }
        QRCodeDecoder.createQRCode(secretContent)?.let { bitmap ->
            container.addView(ImageView(this).apply {
                setImageBitmap(bitmap)
                adjustViewBounds = true
                layoutParams = LinearLayout.LayoutParams(-1, 520)
            })
        }
        container.addView(Button(this).apply {
            if (singleServerLink != null) {
                setText(R.string.mobiletina_copy_server_link)
                setOnClickListener { Utils.setClipboard(this@MainActivity, singleServerLink) }
            } else {
                setText(R.string.mobiletina_copy_subscription_link)
                setOnClickListener { Utils.setClipboard(this@MainActivity, subscription.url) }
            }
        })
        container.addView(Button(this).apply {
            setText(R.string.mobiletina_copy_all_configs)
            setOnClickListener { MobileTinaHiddenShareManager.copyAllConfigs(this@MainActivity, subscriptionId) }
        })
'''
          if old in s:
              s = s.replace(old, new, 1)
          assert 'val singleServerLink = MmkvManager.decodeServerList(subscriptionId)' in s
          main.write_text(s, encoding='utf-8')

          s = layout.read_text(encoding='utf-8')
          s = s.replace('android:layout_height="156dp"\n                    android:background="@color/mobiletina_manual_dock_bg"',
                        'android:layout_height="166dp"\n                    android:background="@color/mobiletina_manual_dock_bg"', 1)
          redundant = '''
                    <View
                        android:layout_width="match_parent"
                        android:layout_height="110dp"
                        android:layout_gravity="bottom"
                        android:background="@color/mobiletina_manual_dock_bg" />
'''
          s = s.replace(redundant, '', 1)
          smart_start = s.index('android:id="@+id/btn_smart_connect"')
          row_start = s.index('android:id="@+id/manual_selected_row"')
          smart_block = s[smart_start:row_start].replace('                        android:translationY="-12dp"\n', '', 1)
          s = s[:smart_start] + smart_block + s[row_start:]
          s = s.replace('android:layout_marginTop="132dp"\n                        android:gravity="center"',
                        'android:layout_marginTop="142dp"\n                        android:gravity="center"', 1)
          assert 'android:layout_height="166dp"' in s
          layout.write_text(s, encoding='utf-8')

          s = strings.read_text(encoding='utf-8')
          s = s.replace('<string name="toast_failure">Failure</string>', '<string name="toast_failure">خطا</string>', 1)
          if 'name="mobiletina_copy_server_link"' not in s:
              marker = '<string name="mobiletina_copy_subscription_link">'
              pos = s.find(marker)
              assert pos >= 0
              line_end = s.find('\n', pos)
              s = s[:line_end+1] + '    <string name="mobiletina_copy_server_link">کپی لینک سرور</string>\n' + s[line_end+1:]
          assert '<string name="toast_failure">خطا</string>' in s
          strings.write_text(s, encoding='utf-8')

      - name: Commit requested source fixes
        run: |
          git config user.name "MobileTina CI"
          git config user.email "actions@github.com"
          git add V2rayNG/app/src/main/java/com/v2ray/ang/ui/MainActivity.kt \
                  V2rayNG/app/src/main/java/com/v2ray/ang/handler/MobileTinaHiddenShareManager.kt \
                  V2rayNG/app/src/main/res/layout/activity_main.xml \
                  V2rayNG/app/src/main/res/values/strings.xml
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "Add single-server QR and fix Manual FAB layout"
            git push origin HEAD:agent/mobiletina-2.2.6-port
          fi

      - name: Verify MobileTina identity and exact artwork
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.v2ray.mobiletina"' V2rayNG/app/build.gradle.kts
          grep -q 'versionName = "2.2.6"' V2rayNG/app/build.gradle.kts
          grep -q 'versionCode = 744' V2rayNG/app/build.gradle.kts
          echo '44d73fbbbf50b037ab0184059e0d890f4fa87a13121d5b9b8fe82c59d67f6903  V2rayNG/app/src/main/res/drawable-nodpi/mt_auto_white.png' | sha256sum -c -
          echo 'efa8450467ec7ebe208d71a9b84a55877c416a5193e50c53fba0e50ea8cfc76c  V2rayNG/app/src/main/res/drawable-nodpi/mt_auto_yellow.png' | sha256sum -c -
          echo '14a34d2485c19090f29e74547a126a59180014659dc045fa7594ad62434e8e89  V2rayNG/app/src/main/res/drawable-nodpi/mt_auto_blue.png' | sha256sum -c -
          echo '5c46b28c45361fad6b93612b5cb4e8dff6793437ad9908e44cec695360380eb9  V2rayNG/app/src/main/res/drawable-nodpi/mt_auto_red.png' | sha256sum -c -
          echo '9c785413bec4f4e707e69decfeaa387e1c4d6268f40a1ad357c135770b763abc  V2rayNG/app/src/main/res/drawable-nodpi/mt_manual_stop.webp' | sha256sum -c -
          echo 'a4dee906b06e9f0833b35efa77182ac8d567a3e9d0ab335ffe4c70e7aa261026  V2rayNG/app/src/main/res/drawable-nodpi/mt_manual_fab.webp' | sha256sum -c -
          echo 'f33b9e6d04c2f6ec344c917f3a2412075c8f62af841b444ffa7a864099e395f7  V2rayNG/app/src/main/res/drawable-nodpi/mt_nav.png' | sha256sum -c -

      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK 29
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=0 --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          python3 - <<'PY'
          from pathlib import Path
          p=Path('V2rayNG/app/build.gradle.kts')
          s=p.read_text()
          p.write_text(s.replace('android {\n', 'android {\n    ndkVersion = "29.0.14206865"\n', 1))
          PY

      - name: Restore libhevtun cache
        id: hev-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/libs
          key: mt226-hev-${{ runner.os }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Build libhevtun
        if: steps.hev-cache.outputs.cache-hit != 'true'
        run: bash compile-hevtun.sh

      - name: Save libhevtun cache
        if: steps.hev-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/libs
          key: mt226-hev-${{ runner.os }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Copy libhevtun
        run: cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

      - name: Resolve libv2ray tag
        run: |
          pushd AndroidLibXrayLite
          CURRENT_TAG=$(git describe --tags --abbrev=0)
          echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
          popd

      - name: Download matching libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: ${{ env.CURRENT_TAG }}
          fileName: 'libv2ray.aar'
          out-file-path: V2rayNG/app/libs/

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build MobileTina 2.2.6 ARMv7
        run: |
          cd V2rayNG
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          ./gradlew assemblePlaystoreDebug -PABI_FILTERS=armeabi-v7a

      - name: Upload MobileTina 2.2.6 ARMv7 APK
        uses: actions/upload-artifact@v7
        with:
          name: MobileTina-2.2.6-armeabi-v7a
          path: V2rayNG/app/build/outputs/apk/playstore/debug/*armeabi-v7a*.apk
          if-no-files-found: error
          retention-days: 90
