name: MobileTina 2.2.6 Hardened Release

on:
  push:
    branches:
      - agent/mobiletina-2.2.6-port
  workflow_dispatch:

jobs:
  hardened-arm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify hardening source contracts
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.v2ray.mobiletina"' V2rayNG/app/build.gradle.kts
          grep -q 'FINAL_HARDENED_BUILD' V2rayNG/app/build.gradle.kts
          grep -q 'mobileTinaHardened' V2rayNG/app/build.gradle.kts
          grep -q 'enableV2Signing = true' V2rayNG/app/build.gradle.kts
          grep -q 'enableV3Signing = true' V2rayNG/app/build.gradle.kts
          grep -q 'isMinifyEnabled = true' V2rayNG/app/build.gradle.kts
          grep -q 'isShrinkResources = true' V2rayNG/app/build.gradle.kts
          grep -q -- '-repackageclasses' V2rayNG/app/proguard-rules.pro
          grep -q 'class go\.\*\*' V2rayNG/app/proguard-rules.pro
          grep -q 'class libv2ray\.\*\*' V2rayNG/app/proguard-rules.pro
          grep -q 'MobileTinaIntegrityGuard.verify' V2rayNG/app/src/main/java/com/v2ray/ang/AngApplication.kt
          ! grep -q 'android.enableR8.fullMode=false' V2rayNG/gradle.properties
          ! grep -q 'android.r8.strictFullModeForKeepRules=false' V2rayNG/gradle.properties

          echo '44d73fbbbf50b037ab0184059e0d890f4fa87a13121d5b9b8fe82c59d67f6903  V2rayNG/app/src/main/res/drawable-nodpi/mt_auto_white.png' | sha256sum -c -
          echo 'efa8450467ec7ebe208d71a9b84a55877c416a5193e50c53fba0e50ea8cfc76c  V2rayNG/app/src/main/res/drawable-nodpi/mt_auto_yellow.png' | sha256sum -c -
          echo '14a34d2485c19090f29e74547a126a59180014659dc045fa7594ad62434e8e89  V2rayNG/app/src/main/res/drawable-nodpi/mt_auto_blue.png' | sha256sum -c -
          echo '5c46b28c45361fad6b93612b5cb4e8dff6793437ad9908e44cec695360380eb9  V2rayNG/app/src/main/res/drawable-nodpi/mt_auto_red.png' | sha256sum -c -
          echo '9c785413bec4f4e707e69decfeaa387e1c4d6268f40a1ad357c135770b763abc  V2rayNG/app/src/main/res/drawable-nodpi/mt_manual_stop.webp' | sha256sum -c -
          echo 'a4dee906b06e9f0833b35efa77182ac8d567a3e9d0ab335ffe4c70e7aa261026  V2rayNG/app/src/main/res/drawable-nodpi/mt_manual_fab.webp' | sha256sum -c -
          echo '22b1878853ee3793b81d545d01dfe5b8fad837689913e8530d55b90f510aa55a  V2rayNG/app/src/main/res/drawable-nodpi/mt_manual_auto.webp' | sha256sum -c -
          echo 'f33b9e6d04c2f6ec344c917f3a2412075c8f62af841b444ffa7a864099e395f7  V2rayNG/app/src/main/res/drawable-nodpi/mt_nav.png' | sha256sum -c -

      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK 29
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=0 --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          python3 - <<'PY'
          from pathlib import Path
          p = Path('V2rayNG/app/build.gradle.kts')
          s = p.read_text()
          p.write_text(s.replace('android {\n', 'android {\n    ndkVersion = "29.0.14206865"\n', 1))
          PY

      - name: Restore libhevtun cache
        id: hev-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/libs
          key: mt226-hev-${{ runner.os }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Build libhevtun
        if: steps.hev-cache.outputs.cache-hit != 'true'
        run: bash compile-hevtun.sh

      - name: Save libhevtun cache
        if: steps.hev-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/libs
          key: mt226-hev-${{ runner.os }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Copy libhevtun
        run: cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

      - name: Resolve and download libv2ray
        run: |
          set -euo pipefail
          pushd AndroidLibXrayLite
          CURRENT_TAG=$(git describe --tags --abbrev=0)
          popd
          echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
          gh release download "$CURRENT_TAG" \
            --repo 2dust/AndroidLibXrayLite \
            --pattern 'libv2ray.aar' \
            --dir V2rayNG/app/libs
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare dedicated hardened signer and certificate lock
        run: |
          set -euo pipefail
          HARDENED_KEYSTORE="$RUNNER_TEMP/mobiletina-2.2.6-hardened.p12"
          HARDENED_STORE_PASSWORD='mobiletina-2.2.6-hardened-ci'
          HARDENED_KEY_ALIAS='mobiletina_hardened'
          HARDENED_KEY_PASSWORD="$HARDENED_STORE_PASSWORD"
          rm -f "$HARDENED_KEYSTORE"

          keytool -genkeypair \
            -storetype PKCS12 \
            -keystore "$HARDENED_KEYSTORE" \
            -storepass "$HARDENED_STORE_PASSWORD" \
            -alias "$HARDENED_KEY_ALIAS" \
            -keypass "$HARDENED_KEY_PASSWORD" \
            -dname 'CN=MobileTina Hardened,O=MobileTina,C=IR' \
            -keyalg RSA \
            -keysize 4096 \
            -sigalg SHA256withRSA \
            -validity 10000 \
            -noprompt

          CERT_SHA=$(keytool -exportcert \
            -storetype PKCS12 \
            -keystore "$HARDENED_KEYSTORE" \
            -storepass "$HARDENED_STORE_PASSWORD" \
            -alias "$HARDENED_KEY_ALIAS" | sha256sum | awk '{print $1}')
          test ${#CERT_SHA} -eq 64

          echo "CERT_SHA=$CERT_SHA" >> $GITHUB_ENV
          echo "HARDENED_KEYSTORE=$HARDENED_KEYSTORE" >> $GITHUB_ENV
          echo "HARDENED_STORE_PASSWORD=$HARDENED_STORE_PASSWORD" >> $GITHUB_ENV
          echo "HARDENED_KEY_ALIAS=$HARDENED_KEY_ALIAS" >> $GITHUB_ENV
          echo "HARDENED_KEY_PASSWORD=$HARDENED_KEY_PASSWORD" >> $GITHUB_ENV
          echo "Hardened signer SHA-256: $CERT_SHA"

      - name: Test and build hardened ARMv7 + ARMv8 release
        run: |
          set -euo pipefail
          cd V2rayNG
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          ./gradlew \
            testPlaystoreDebugUnitTest \
            --tests com.v2ray.ang.handler.MobileTinaExpiryManagerTest \
            assemblePlaystoreRelease \
            '-PFAT_APK_ABIS=armeabi-v7a;arm64-v8a' \
            -PFINAL_HARDENED_BUILD=true \
            -PMOBILETINA_EXPECTED_CERT_SHA256="$CERT_SHA" \
            -PFINAL_HARDENED_KEYSTORE="$HARDENED_KEYSTORE" \
            -PFINAL_HARDENED_STORE_PASSWORD="$HARDENED_STORE_PASSWORD" \
            -PFINAL_HARDENED_KEY_ALIAS="$HARDENED_KEY_ALIAS" \
            -PFINAL_HARDENED_KEY_PASSWORD="$HARDENED_KEY_PASSWORD"

      - name: Verify hardened APK, obfuscation and anti-tamper payload
        run: |
          set -euo pipefail
          APK=$(find V2rayNG/app/build/outputs/apk/playstore/release -type f -name '*armv7-armv8*.apk' -print -quit)
          test -n "$APK"
          echo "Verifying $APK"

          $ANDROID_HOME/build-tools/37.0.0/apksigner verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/apksigner.txt
          APK_CERT=$(sed -n 's/^.*certificate SHA-256 digest: //p' /tmp/apksigner.txt | head -n1 | tr -d ':' | tr 'A-F' 'a-f')
          test "$APK_CERT" = "$CERT_SHA"

          printf 'arm64-v8a\narmeabi-v7a\n' > /tmp/expected-abis
          zipinfo -1 "$APK" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u > /tmp/apk-abis
          diff -u /tmp/expected-abis /tmp/apk-abis

          MAPPING=$(find V2rayNG/app/build/outputs/mapping -type f -name mapping.txt -print -quit)
          test -n "$MAPPING"
          test -s "$MAPPING"
          echo "Mapping SHA-256: $(sha256sum "$MAPPING" | awk '{print $1}')"

          DEX_DIR=$(mktemp -d)
          unzip -q "$APK" 'classes*.dex' -d "$DEX_DIR"
          find "$DEX_DIR" -type f -name 'classes*.dex' -print > /tmp/dex-files
          test -s /tmp/dex-files

          has_dex_token() {
            local token="$1"
            while IFS= read -r dex; do
              if grep -aFq -- "$token" "$dex"; then
                return 0
              fi
            done < /tmp/dex-files
            return 1
          }

          # Internal MobileTina implementation names must not survive the hardened DEX.
          for internal_name in \
            'Lcom/v2ray/ang/util/MobileTinaIntegrityGuard;' \
            'Lcom/v2ray/ang/util/MobileTinaImportNormalizer;' \
            'Lcom/v2ray/ang/handler/MobileTinaSubscriptionUpdateOptimizer;'; do
            if has_dex_token "$internal_name"; then
              echo "::error::Internal class was not obfuscated/repackaged: $internal_name"
              exit 1
            fi
          done

          # Native/gomobile descriptors that previously crashed when renamed must remain exact.
          for runtime_class in \
            'Lcom/v2ray/ang/core/CoreServiceManager$CoreCallback;' \
            'Lcom/v2ray/ang/core/CoreServiceManager$XrayProcessFinder;' \
            'Lcom/v2ray/ang/service/TProxyService;' \
            'Llibv2ray/CoreController;' \
            'Lgo/Seq;'; do
            if ! has_dex_token "$runtime_class"; then
              echo "::error::Required native/runtime class missing: $runtime_class"
              exit 1
            fi
          done

          # Persisted field/enum tokens remain stable across updates even under R8.
          for field in configVersion configType subscriptionId remarks server serverPort password method flow username network headerType host path security sni publicKey shortId; do
            has_dex_token "$field" || { echo "::error::Persisted field missing: $field"; exit 1; }
          done
          for enum_name in VMESS CUSTOM SHADOWSOCKS SOCKS VLESS TROJAN WIREGUARD HYSTERIA2 HYSTERIA HTTP POLICYGROUP PROXYCHAIN; do
            has_dex_token "$enum_name" || { echo "::error::Persisted enum missing: $enum_name"; exit 1; }
          done

          # AAPT/R8 must hide the original artwork filenames in the APK while preserving exact bytes.
          if zipinfo -1 "$APK" | grep -Eq 'mt_auto_|mt_manual_|mt_nav'; then
            echo "::error::Original MobileTina artwork filename survived resource optimization"
            exit 1
          fi

          python3 - "$APK" <<'PY'
          import hashlib, sys, zipfile
          expected = {
              '44d73fbbbf50b037ab0184059e0d890f4fa87a13121d5b9b8fe82c59d67f6903',
              'efa8450467ec7ebe208d71a9b84a55877c416a5193e50c53fba0e50ea8cfc76c',
              '14a34d2485c19090f29e74547a126a59180014659dc045fa7594ad62434e8e89',
              '5c46b28c45361fad6b93612b5cb4e8dff6793437ad9908e44cec695360380eb9',
              '9c785413bec4f4e707e69decfeaa387e1c4d6268f40a1ad357c135770b763abc',
              'a4dee906b06e9f0833b35efa77182ac8d567a3e9d0ab335ffe4c70e7aa261026',
              '22b1878853ee3793b81d545d01dfe5b8fad837689913e8530d55b90f510aa55a',
              'f33b9e6d04c2f6ec344c917f3a2412075c8f62af841b444ffa7a864099e395f7',
          }
          found = set()
          with zipfile.ZipFile(sys.argv[1]) as zf:
              for name in zf.namelist():
                  if name.startswith('res/') and (name.endswith('.png') or name.endswith('.webp')):
                      digest = hashlib.sha256(zf.read(name)).hexdigest()
                      if digest in expected:
                          found.add(digest)
          missing = expected - found
          if missing:
              raise SystemExit(f'protected artwork bytes missing from hardened APK: {sorted(missing)}')
          print('All protected artwork hashes found in optimized resource payload')
          PY

          $ANDROID_HOME/build-tools/37.0.0/aapt2 dump resources "$APK" > /tmp/apk-resources.txt
          for text in \
            'فیلترشکن' \
            'حالت خودکار' \
            'حالت دستی' \
            'متصل شد' \
            'فیلترشکن خاموش است' \
            'ابتدا یک سرور انتخاب کنید'; do
            grep -Fq "$text" /tmp/apk-resources.txt || { echo "::error::Protected text missing: $text"; exit 1; }
          done

          # Removed backup/webdav code must stay absent from the final hardened payload.
          for removed in BackupActivity WebDavManager WebDavConfig backup_ng.zip; do
            if has_dex_token "$removed"; then
              echo "::error::Removed backup/WebDAV token returned: $removed"
              exit 1
            fi
          done

          SHA=$(sha256sum "$APK" | tee V2rayNG/app/build/outputs/apk/playstore/release/MobileTina-2.2.6-armv7-armv8-hardened.sha256 | awk '{print $1}')
          SIZE=$(stat -c '%s' "$APK")
          printf 'commit=%s\napk_sha256=%s\napk_bytes=%s\nsigner_sha256=%s\n' \
            "$GITHUB_SHA" "$SHA" "$SIZE" "$CERT_SHA" \
            > V2rayNG/app/build/outputs/apk/playstore/release/MobileTina-2.2.6-hardened-report.txt

      - name: Upload hardened MobileTina APK
        uses: actions/upload-artifact@v7
        with:
          name: MobileTina-2.2.6-armv7-armv8-hardened
          path: |
            V2rayNG/app/build/outputs/apk/playstore/release/*armv7-armv8*.apk
            V2rayNG/app/build/outputs/apk/playstore/release/MobileTina-2.2.6-armv7-armv8-hardened.sha256
            V2rayNG/app/build/outputs/apk/playstore/release/MobileTina-2.2.6-hardened-report.txt
          if-no-files-found: error
          retention-days: 90
