name: MobileTina dock position patch

on:
  push:
    branches:
      - agent/mobiletina-2.2.6-port
    paths:
      - .github/workflows/mobiletina-dock-position-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/mobiletina-2.2.6-port
      - name: Preserve absolute Manual button positions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('V2rayNG/app/src/main/res/layout/activity_main.xml')
          s = p.read_text(encoding='utf-8')
          fab = '''                        android:scaleType="fitCenter"\n                        android:src="@drawable/mt_manual_stop"'''
          if 'android:id="@+id/fab"' in s and 'android:translationY="-12dp"' not in s[s.index('android:id="@+id/fab"'):s.index('android:id="@+id/btn_smart_connect"')]:
              assert fab in s
              s = s.replace(fab, '''                        android:scaleType="fitCenter"\n                        android:translationY="-12dp"\n                        android:src="@drawable/mt_manual_stop"''', 1)
          marker = '''                        android:textSize="16sp"\n                        app:cornerRadius="25dp"'''
          smart_start = s.index('android:id="@+id/btn_smart_connect"')
          smart_end = s.index('android:id="@+id/manual_selected_row"')
          if 'android:translationY="-12dp"' not in s[smart_start:smart_end]:
              assert marker in s[smart_start:]
              s = s.replace(marker, '''                        android:textSize="16sp"\n                        android:translationY="-12dp"\n                        app:cornerRadius="25dp"''', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "MobileTina CI"
          git config user.email "actions@github.com"
          git rm -f .github/workflows/mobiletina-dock-position-temp.yml
          git add V2rayNG/app/src/main/res/layout/activity_main.xml
          git diff --cached --check
          git commit -m "Preserve Manual controls while compacting dock"
          git push origin HEAD:agent/mobiletina-2.2.6-port
