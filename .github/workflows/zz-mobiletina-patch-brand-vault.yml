name: MobileTina one-time brand vault patch

on:
  push:
    branches:
      - agent/mobiletina-2.2.6-port

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/mobiletina-2.2.6-port
          fetch-depth: 0

      - name: Replace optimizer-foldable social label with runtime vault
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('V2rayNG/app/src/main/java/com/v2ray/ang/ui/MainActivity.kt')
          text = path.read_text()
          old = '        private val DEFAULT_SUBSCRIPTION_NAME = intArrayOf(105,110,115,116,97,103,114,97,109,32,58,32,109,111,98,105,108,101,46,116,105,110,97).map { it.toChar() }.joinToString("")'
          new = '        private val DEFAULT_SUBSCRIPTION_NAME: String get() = w.a()'
          if text.count(old) != 1:
              raise SystemExit('expected subscription label initializer was not found exactly once')
          path.write_text(text.replace(old, new, 1))

          forbidden = (
              'instagram : ' + 'mobile' + '.tina',
              'mobile' + '.tina2',
              'mobile' + '.tinaa',
              'vpn' + '963',
              'instagram.com/' + 'mobile' + '.tina',
              't.me/' + 'vpn' + '963',
          )
          source = path.read_text()
          for token in forbidden:
              if token in source:
                  raise SystemExit(f'plaintext social token still exists in MainActivity: {token}')
          PY

      - name: Commit patched source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V2rayNG/app/src/main/java/com/v2ray/ang/ui/MainActivity.kt
          git diff --cached --check
          git commit -m 'Hide subscription social label behind encrypted runtime vault'
          git push origin HEAD:agent/mobiletina-2.2.6-port
