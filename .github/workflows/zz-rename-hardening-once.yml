name: One-shot semantic hardening

on:
  push:
    branches:
      - agent/mobiletina-2.2.6-port

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Remove semantic identifiers from sensitive page
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = Path('V2rayNG/app/src/main/java/com/v2ray/ang/ui/MobileTinaStoreAboutActivity.kt')
          new = Path('V2rayNG/app/src/main/java/com/v2ray/ang/ui/X7.kt')
          if old.exists():
              text = old.read_text().replace('class MobileTinaStoreAboutActivity : AppCompatActivity()', 'class X7 : AppCompatActivity()', 1)
              new.write_text(text)
              old.unlink()
          elif not new.exists():
              raise SystemExit('sensitive activity source not found')

          p = Path('V2rayNG/app/src/main/java/com/v2ray/ang/ui/MainActivity.kt')
          s = p.read_text()
          s = s.replace('R.id.mobiletina_store_about -> startActivity(Intent(this, MobileTinaStoreAboutActivity::class.java))', 'R.id.z0 -> startActivity(Intent(this, X7::class.java))')
          p.write_text(s)

          p = Path('V2rayNG/app/src/playstore/AndroidManifest.xml')
          s = p.read_text().replace('.ui.MobileTinaStoreAboutActivity', '.ui.X7')
          p.write_text(s)

          p = Path('V2rayNG/app/src/main/res/menu/menu_drawer.xml')
          s = p.read_text().replace('@+id/mobiletina_store_about', '@+id/z0')
          p.write_text(s)
          PY

          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A V2rayNG/app/src/main/java/com/v2ray/ang/ui V2rayNG/app/src/playstore/AndroidManifest.xml V2rayNG/app/src/main/res/menu/menu_drawer.xml
          git commit -m 'harden: remove semantic identifiers from sensitive page'
          git push origin HEAD:agent/mobiletina-2.2.6-port
