name: Apply MobileTina 2.2.6 UI polish

on:
  push:
    branches:
      - agent/mobiletina-2.2.6-port
    paths:
      - .github/workflows/mobiletina-226-ui-polish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/mobiletina-2.2.6-port
          fetch-depth: 0

      - name: Apply UI and lifecycle fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise RuntimeError(f'{label}: expected block not found in {path}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # 1) Separate batch-test progress from the connected-server ping channel.
          path = 'V2rayNG/app/src/main/java/com/v2ray/ang/viewmodel/MainViewModel.kt'
          p = Path(path)
          s = p.read_text(encoding='utf-8')
          s = s.replace('import com.v2ray.ang.extension.toastSuccess\n', '')
          old = '''                AppConfig.MSG_STATE_START_SUCCESS -> {\n                    getApplication<AngApplication>().toastSuccess(R.string.toast_services_success)\n                    isRunning.value = true\n                }\n'''
          new = '''                AppConfig.MSG_STATE_START_SUCCESS -> {\n                    // MobileTina keeps successful starts silent; the connected state is visible in the main UI.\n                    isRunning.value = true\n                }\n'''
          if old not in s:
              raise RuntimeError('start-success block not found')
          s = s.replace(old, new, 1)
          old = '''                AppConfig.MSG_MEASURE_CONFIG_NOTIFY -> {\n                    val content = intent.getStringExtra("content")\n                    updateTestResultAction.value =\n                        getApplication<AngApplication>().getString(R.string.connection_runing_task_left, content)\n                }\n'''
          new = '''                AppConfig.MSG_MEASURE_CONFIG_NOTIFY -> {\n                    // Batch Real Ping progress is not a connected-server ping result.\n                    // Smart Connect renders its own countdown, so never feed progress numbers\n                    // (for example 0/1) into updateTestResultAction.\n                }\n'''
          if old not in s:
              raise RuntimeError('real-ping notify block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 2) Professional Smart Connect countdown and subscription refresh only from onResume.
          path = 'V2rayNG/app/src/main/java/com/v2ray/ang/ui/MainActivity.kt'
          p = Path(path)
          s = p.read_text(encoding='utf-8')
          old = '''        binding.tvManualPing.text = when {\n            running && !lastConnectedPing.isNullOrBlank() -> lastConnectedPing\n            else -> pingLabel(ping)\n        }\n'''
          new = '''        binding.tvManualPing.text = when {\n            smartConnecting && smartCountdownSeconds > 0 ->\n                getString(R.string.mobiletina_smart_countdown_short, smartCountdownSeconds)\n            smartConnecting -> getString(R.string.mobiletina_testing)\n            running && !lastConnectedPing.isNullOrBlank() -> lastConnectedPing\n            else -> pingLabel(ping)\n        }\n'''
          if old not in s:
              raise RuntimeError('manual ping display block not found')
          s = s.replace(old, new, 1)

          old = '''        binding.tvAutoPing.text = when {\n            smartConnecting && smartCountdownSeconds > 0 -> smartCountdownSeconds.toString()\n            smartConnecting -> getString(R.string.mobiletina_testing)\n'''
          new = '''        binding.tvAutoPing.text = when {\n            smartConnecting && smartCountdownSeconds > 0 ->\n                getString(R.string.mobiletina_smart_countdown_format, smartCountdownSeconds)\n            smartConnecting -> getString(R.string.mobiletina_testing)\n'''
          if old not in s:
              raise RuntimeError('auto countdown block not found')
          s = s.replace(old, new, 1)

          old = '''    override fun onResume() {\n        super.onResume()\n        MobileTinaExpiryManager.recoverPending(this)\n        setupGroupTab()\n        ensureSelectedServerForCurrentSubscription()\n        refreshSelectedServerUi()\n\n        if (!hasInternetConnection()) {\n            toast(R.string.mobiletina_enable_internet)\n            return\n        }\n        if (!firstRunPrefs.getBoolean(FIRST_RUN_COMPLETED, false)) return\n\n        val now = SystemClock.elapsedRealtime()\n        if (!subscriptionRefreshing && now - lastSubscriptionRefreshAt >= SUBSCRIPTION_REFRESH_GUARD_MS) {\n            lastSubscriptionRefreshAt = now\n            refreshSubscriptionsSilently()\n        }\n    }\n'''
          new = '''    override fun onResume() {\n        super.onResume()\n        MobileTinaExpiryManager.recoverPending(this)\n        setupGroupTab()\n        ensureSelectedServerForCurrentSubscription()\n        refreshSelectedServerUi()\n        updateSubscriptionOnResume()\n    }\n\n    /** Network subscription refreshes belong to the resumed/visible activity lifecycle. */\n    private fun updateSubscriptionOnResume() {\n        if (!hasInternetConnection()) {\n            toast(R.string.mobiletina_enable_internet)\n            return\n        }\n        if (!firstRunPrefs.getBoolean(FIRST_RUN_COMPLETED, false)) return\n\n        val now = SystemClock.elapsedRealtime()\n        if (!subscriptionRefreshing && now - lastSubscriptionRefreshAt >= SUBSCRIPTION_REFRESH_GUARD_MS) {\n            lastSubscriptionRefreshAt = now\n            refreshSubscriptionsSilently()\n        }\n    }\n'''
          if old not in s:
              raise RuntimeError('onResume subscription block not found')
          s = s.replace(old, new, 1)

          old = '''    private fun markFirstRunPermissionCompleted() {\n        firstRunPrefs.edit().putBoolean(FIRST_RUN_COMPLETED, true).apply()\n        checkAndRequestPermission(PermissionType.POST_NOTIFICATIONS) { }\n        if (hasInternetConnection()) refreshSubscriptionsSilently()\n    }\n'''
          new = '''    private fun markFirstRunPermissionCompleted() {\n        firstRunPrefs.edit().putBoolean(FIRST_RUN_COMPLETED, true).apply()\n        checkAndRequestPermission(PermissionType.POST_NOTIFICATIONS) { }\n        // Subscription updating is intentionally deferred to onResume.\n    }\n'''
          if old not in s:
              raise RuntimeError('first-run refresh block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 3) Auto panel: slightly larger FAB and move the complete content group down.
          path = 'V2rayNG/app/src/main/res/layout/activity_main.xml'
          p = Path(path)
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('android:paddingTop="56dp"', 'android:paddingTop="72dp"', 'auto panel top padding'),
              ('android:id="@+id/fab_auto"\n                        android:layout_width="208dp"\n                        android:layout_height="208dp"',
               'android:id="@+id/fab_auto"\n                        android:layout_width="224dp"\n                        android:layout_height="224dp"', 'auto fab size'),
              ('android:id="@+id/tv_auto_status"\n                        android:layout_width="wrap_content"\n                        android:layout_height="wrap_content"\n                        android:layout_marginTop="16dp"',
               'android:id="@+id/tv_auto_status"\n                        android:layout_width="wrap_content"\n                        android:layout_height="wrap_content"\n                        android:layout_marginTop="20dp"', 'auto status spacing'),
              ('android:id="@+id/tv_auto_server"\n                        android:layout_width="match_parent"\n                        android:layout_height="wrap_content"\n                        android:layout_marginTop="22dp"',
               'android:id="@+id/tv_auto_server"\n                        android:layout_width="match_parent"\n                        android:layout_height="wrap_content"\n                        android:layout_marginTop="24dp"', 'auto server spacing'),
              ('android:layout_marginTop="30dp"\n                        android:layout_marginEnd="2dp"\n                        android:visibility="gone"',
               'android:layout_marginTop="34dp"\n                        android:layout_marginEnd="2dp"\n                        android:visibility="gone"', 'subscription card spacing'),
          ]
          for old, new, label in replacements:
              if old not in s:
                  raise RuntimeError(f'{label}: block not found')
              s = s.replace(old, new, 1)

          # 4) Light-mode manual dock: make the whole lower control area a clear dark surface
          # and explicitly use high-contrast text instead of inheriting light-theme dark text.
          old = '''                <FrameLayout\n                    android:layout_width="match_parent"\n                    android:layout_height="186dp"\n                    android:clipChildren="false"\n                    android:clipToPadding="false">'''
          new = '''                <FrameLayout\n                    android:layout_width="match_parent"\n                    android:layout_height="186dp"\n                    android:background="@color/mobiletina_manual_dock_bg"\n                    android:clipChildren="false"\n                    android:clipToPadding="false">'''
          if old not in s:
              raise RuntimeError('manual dock frame not found')
          s = s.replace(old, new, 1)
          s = s.replace('android:background="#2B2B2B" />', 'android:background="@color/mobiletina_manual_dock_bg" />', 1)

          # Explicit text colors for selected server, separator and ping.
          marker = 'android:id="@+id/tv_manual_selected"'
          idx = s.find(marker)
          if idx < 0:
              raise RuntimeError('manual selected text not found')
          segment_end = s.find('</LinearLayout>', idx)
          segment = s[idx:segment_end]
          # Three TextViews in this row; add textColor before textAppearance where absent.
          segment = segment.replace('android:textAppearance="@style/TextAppearance.AppCompat.Small"',
                                    'android:textColor="@color/mobiletina_manual_dock_text"\n                            android:textAppearance="@style/TextAppearance.AppCompat.Small"')
          s = s[:idx] + segment + s[segment_end:]
          p.write_text(s, encoding='utf-8')

          # 5) Strings/colors for clear countdown and day/night-safe manual dock.
          path = 'V2rayNG/app/src/main/res/values/mobiletina_strings.xml'
          p = Path(path)
          s = p.read_text(encoding='utf-8')
          anchor = '    <string name="mobiletina_countdown_format" translatable="false">%1$d</string>\n'
          extra = '''    <string name="mobiletina_countdown_format" translatable="false">%1$d</string>\n    <string name="mobiletina_smart_countdown_format" translatable="false">در حال انتخاب بهترین سرور • %1$d ثانیه</string>\n    <string name="mobiletina_smart_countdown_short" translatable="false">%1$d ثانیه</string>\n'''
          if anchor not in s:
              raise RuntimeError('countdown string anchor not found')
          s = s.replace(anchor, extra, 1)
          p.write_text(s, encoding='utf-8')

          path = 'V2rayNG/app/src/main/res/values/mobiletina_colors.xml'
          p = Path(path)
          s = p.read_text(encoding='utf-8')
          old = '    <color name="colorTextPrimary">#1C1B1F</color>\n'
          new = '''    <color name="colorTextPrimary">#1C1B1F</color>\n    <color name="mobiletina_manual_dock_bg">#2B2B2B</color>\n    <color name="mobiletina_manual_dock_text">#FFFFFF</color>\n'''
          if old not in s:
              raise RuntimeError('mobiletina colors anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MobileTina CI"
          git config user.email "actions@github.com"
          git add V2rayNG/app/src/main/java/com/v2ray/ang/viewmodel/MainViewModel.kt \
                  V2rayNG/app/src/main/java/com/v2ray/ang/ui/MainActivity.kt \
                  V2rayNG/app/src/main/res/layout/activity_main.xml \
                  V2rayNG/app/src/main/res/values/mobiletina_strings.xml \
                  V2rayNG/app/src/main/res/values/mobiletina_colors.xml
          git diff --cached --check
          git commit -m "Polish MobileTina light mode timer and resume refresh"
          git push origin HEAD:agent/mobiletina-2.2.6-port
