name: MobileTina remove locale packs

on:
  pull_request:
    branches:
      - agent/v2rayng-2.2.6-base

permissions:
  contents: write

jobs:
  remove-locales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/mobiletina-2.2.6-port
          fetch-depth: 0
      - name: Remove non-default locale resources
        shell: bash
        run: |
          set -euo pipefail
          git rm -r \
            V2rayNG/app/src/main/res/values-ar \
            V2rayNG/app/src/main/res/values-bn \
            V2rayNG/app/src/main/res/values-bqi-rIR \
            V2rayNG/app/src/main/res/values-fa \
            V2rayNG/app/src/main/res/values-ru \
            V2rayNG/app/src/main/res/values-vi \
            V2rayNG/app/src/main/res/values-zh-rCN \
            V2rayNG/app/src/main/res/values-zh-rTW
          git rm -f .github/workflows/mobiletina-locale-audit-temp.yml
          git rm -f .github/workflows/mobiletina-remove-locales-temp.yml
          git config user.name "MobileTina CI"
          git config user.email "actions@github.com"
          git diff --cached --check
          git commit -m "Keep only default language resources"
          git push origin HEAD:agent/mobiletina-2.2.6-port
