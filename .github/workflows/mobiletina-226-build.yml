name: MobileTina 2.2.6 ARMv7 Build

on:
  push:
    branches:
      - agent/mobiletina-2.2.6-port
    paths:
      - 'V2rayNG/**'
      - '.github/workflows/mobiletina-226-build.yml'

permissions:
  contents: write

concurrency:
  group: mobiletina-226-armv7
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify MobileTina identity and exact artwork
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.v2ray.mobiletina"' V2rayNG/app/build.gradle.kts
          grep -q 'versionName = "2.2.6"' V2rayNG/app/build.gradle.kts
          grep -q 'versionCode = 744' V2rayNG/app/build.gradle.kts
          echo '44d73fbbbf50b037ab0184059e0d890f4fa87a13121d5b9b8fe82c59d67f6903  V2rayNG/app/src/main/res/drawable-nodpi/mt_auto_white.png' | sha256sum -c -
          echo 'efa8450467ec7ebe208d71a9b84a55877c416a5193e50c53fba0e50ea8cfc76c  V2rayNG/app/src/main/res/drawable-nodpi/mt_auto_yellow.png' | sha256sum -c -
          echo '14a34d2485c19090f29e74547a126a59180014659dc045fa7594ad62434e8e89  V2rayNG/app/src/main/res/drawable-nodpi/mt_auto_blue.png' | sha256sum -c -
          echo '5c46b28c45361fad6b93612b5cb4e8dff6793437ad9908e44cec695360380eb9  V2rayNG/app/src/main/res/drawable-nodpi/mt_auto_red.png' | sha256sum -c -
          echo '9c785413bec4f4e707e69decfeaa387e1c4d6268f40a1ad357c135770b763abc  V2rayNG/app/src/main/res/drawable-nodpi/mt_manual_stop.webp' | sha256sum -c -
          echo 'a4dee906b06e9f0833b35efa77182ac8d567a3e9d0ab335ffe4c70e7aa261026  V2rayNG/app/src/main/res/drawable-nodpi/mt_manual_fab.webp' | sha256sum -c -
          echo 'f33b9e6d04c2f6ec344c917f3a2412075c8f62af841b444ffa7a864099e395f7  V2rayNG/app/src/main/res/drawable-nodpi/mt_nav.png' | sha256sum -c -

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK 29
        shell: bash
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=0 --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          python3 - <<'PY'
          from pathlib import Path
          p=Path('V2rayNG/app/build.gradle.kts')
          s=p.read_text()
          needle='android {\n'
          if needle not in s: raise SystemExit('android block not found')
          p.write_text(s.replace(needle, needle+'    ndkVersion = "29.0.14206865"\n', 1))
          PY

      - name: Restore libhevtun cache
        id: hev-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/libs
          key: mt226-hev-${{ runner.os }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Build libhevtun
        if: steps.hev-cache.outputs.cache-hit != 'true'
        run: bash compile-hevtun.sh

      - name: Save libhevtun cache
        if: steps.hev-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/libs
          key: mt226-hev-${{ runner.os }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Copy libhevtun
        run: cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

      - name: Resolve AndroidLibXrayLite tag
        shell: bash
        run: |
          pushd AndroidLibXrayLite
          CURRENT_TAG=$(git describe --tags --abbrev=0)
          echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
          popd

      - name: Download matching libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: ${{ env.CURRENT_TAG }}
          fileName: 'libv2ray.aar'
          out-file-path: V2rayNG/app/libs/

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile ARMv7 and capture log
        id: compile
        shell: bash
        run: |
          set +e
          cd V2rayNG
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          ./gradlew assemblePlaystoreDebug -PABI_FILTERS=armeabi-v7a 2>&1 | tee ../mobiletina-226-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write CI report
        if: always()
        shell: bash
        env:
          BUILD_EXIT: ${{ steps.compile.outputs.exit_code }}
        run: |
          set -euo pipefail
          git checkout -- V2rayNG/app/build.gradle.kts || true
          mkdir -p .github/verification
          report=.github/verification/mobiletina-226-ci.txt
          {
            echo "MobileTina v2rayNG 2.2.6 ARMv7 CI"
            echo "run=$GITHUB_RUN_ID"
            echo "sha=$GITHUB_SHA"
            echo "build_exit=${BUILD_EXIT:-999}"
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "---- build log tail ----"
            tail -n 220 mobiletina-226-build.log 2>/dev/null || true
          } > "$report"
          git config user.name "VPN963"
          git config user.email "120357728+VPN963@users.noreply.github.com"
          git add "$report"
          git commit -m "Update MobileTina 2.2.6 ARMv7 CI report" || true
          git push origin HEAD:agent/mobiletina-2.2.6-port

      - name: Upload ARMv7 APK
        if: steps.compile.outputs.exit_code == '0'
        uses: actions/upload-artifact@v7
        with:
          name: MobileTina-2.2.6-armeabi-v7a
          path: V2rayNG/app/build/outputs/apk/playstore/debug/*armeabi-v7a*.apk
          if-no-files-found: error

      - name: Fail job when compile failed
        if: steps.compile.outputs.exit_code != '0'
        run: exit 1
